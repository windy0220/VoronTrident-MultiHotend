#####################################################################
# Eddy-ng 自动标定 T0/T1/T2/T3 工具 Z 偏移
#
# 使用方式：
#
#   CALIBRATE_TOOL_Z_EDDY
#
# 或：
#
#   CALIBRATE_TOOL_Z_EDDY BED=80 TEMP=150 X=150 Y=150 SAVE=1
#
# 参数：
#   BED  = 热床温度，默认 80℃
#   TEMP = 喷嘴温度，默认 150℃
#   X    = TAP 测试位置 X，默认 150
#   Y    = TAP 测试位置 Y，默认 150
#   SAVE = 1 自动保存到 myvariables.cfg
#          0 只显示结果，不保存
#
# 注意：
#   1. 只校准 Z 偏移
#   2. X/Y 偏移不由 Eddy TAP 标定
#   3. 所有喷嘴必须清洁
#   4. 推荐床温使用实际打印温度
#   5. 推荐喷嘴 150℃ 左右，避免漏料
#####################################################################

[gcode_macro CALIBRATE_TOOL_Z_EDDY]
description: 使用 Eddy-ng TAP 自动标定 T0/T1/T2/T3 的 Z 工具偏移
variable_ref_z: 0.0
variable_t1_z: 0.0
variable_t2_z: 0.0
variable_t3_z: 0.0
variable_cal_x: 150.0
variable_cal_y: 150.0
variable_cal_temp: 150.0
variable_cal_bed: 80.0
variable_cal_save: 0
gcode:

    {% set bed = params.BED|default(40)|float %}
    {% set temp = params.TEMP|default(150)|float %}
    {% set x = params.X|default(150)|float %}
    {% set y = params.Y|default(150)|float %}
    {% set save = params.SAVE|default(0)|int %}

    # 保存本次校准参数
    SET_GCODE_VARIABLE MACRO=CALIBRATE_TOOL_Z_EDDY VARIABLE=cal_x VALUE={x}
    SET_GCODE_VARIABLE MACRO=CALIBRATE_TOOL_Z_EDDY VARIABLE=cal_y VALUE={y}
    SET_GCODE_VARIABLE MACRO=CALIBRATE_TOOL_Z_EDDY VARIABLE=cal_temp VALUE={temp}
    SET_GCODE_VARIABLE MACRO=CALIBRATE_TOOL_Z_EDDY VARIABLE=cal_bed VALUE={bed}
    SET_GCODE_VARIABLE MACRO=CALIBRATE_TOOL_Z_EDDY VARIABLE=cal_save VALUE={save}

    # 清除上一次结果
    SET_GCODE_VARIABLE MACRO=CALIBRATE_TOOL_Z_EDDY VARIABLE=ref_z VALUE=0.0
    SET_GCODE_VARIABLE MACRO=CALIBRATE_TOOL_Z_EDDY VARIABLE=t1_z VALUE=0.0
    SET_GCODE_VARIABLE MACRO=CALIBRATE_TOOL_Z_EDDY VARIABLE=t2_z VALUE=0.0
    SET_GCODE_VARIABLE MACRO=CALIBRATE_TOOL_Z_EDDY VARIABLE=t3_z VALUE=0.0

    M118 ========================================================
    M118 [Eddy Z校准] 开始 T0/T1/T2/T3 Z偏移自动标定
    M118 [Eddy Z校准] 测试位置：X{x} Y{y}
    M118 [Eddy Z校准] 热床温度：{bed}℃
    M118 [Eddy Z校准] 喷嘴温度：{temp}℃
    M118 ========================================================

    # =========================================================
    # 安全检查
    # =========================================================

    {% if printer["gcode_button tool_sensor"].state != "RELEASED" %}
        RESPOND TYPE=error MSG="[Eddy Z校准] 当前工具传感器为 PRESSED，禁止开始校准。"
        M118 [Eddy Z校准] 请确认当前没有热端挂在打印头上。
    {% else %}

        # =====================================================
        # 关闭床网，避免当前 mesh 对测试造成干扰
        # =====================================================
        BED_MESH_CLEAR

        # =====================================================
        # 加热
        #
        # Eddy-ng 官方建议 TAP 时热床达到实际打印温度，
        # 喷嘴保持温暖但不要高到明显漏料。
        # =====================================================

        M140 S{bed}

        M104 S{temp} T0
        M104 S{temp} T1
        M104 S{temp} T2
        M104 S{temp} T3

        M190 S{bed}

        # 先 XY / Z 归位
        G28

        # 进入实际校准流程
        _EDDY_Z_CAL_BEGIN

    {% endif %}


#####################################################################
# 校准开始
#####################################################################

[gcode_macro _EDDY_Z_CAL_BEGIN]
gcode:
    {% set status = printer["gcode_macro CALIBRATE_TOOL_Z_EDDY"] %}

    # G28 完成后再次确认传感器状态。
    # 这次检查是在 G28 真正完成之后执行的。
    {% if printer["gcode_button tool_sensor"].state != "RELEASED" %}

        RESPOND TYPE=error MSG="[Eddy Z校准] G28 后工具传感器仍为 PRESSED，停止校准。"
        M118 [Eddy Z校准] 当前机械状态异常，请先人工检查。

    {% else %}

        M118 [Eddy Z校准] 开始 T0 基准 TAP...

        # =====================================================
        # T0
        # =====================================================

        T0

        # 清除当前工具 offset
        # 确保所有工具都从同一个机械坐标系开始 TAP
        SET_GCODE_OFFSET X=0 Y=0 Z=0 MOVE=0

        G90
        G1 X{status.cal_x} Y{status.cal_y} Z5 F6000

        # HOME_Z=0 非常重要：
        # 不让 Eddy-ng 根据本次 TAP 重新建立 Z=0，
        # 我们只读取原始 last_tap_z。
        PROBE_EDDY_NG_TAP HOME_Z=0

        _EDDY_Z_CAL_T0

    {% endif %}


#####################################################################
# T0 结果
#####################################################################

[gcode_macro _EDDY_Z_CAL_T0]
gcode:
    {% set status = printer["gcode_macro CALIBRATE_TOOL_Z_EDDY"] %}
    {% set raw_z = printer["btt_eddy"].last_tap_z|float %}

    # 保存 T0 原始 TAP Z
    SET_GCODE_VARIABLE MACRO=CALIBRATE_TOOL_Z_EDDY VARIABLE=ref_z VALUE={raw_z}

    M118 [Eddy Z校准] T0 原始 TAP Z = {raw_z|round(6)}

    # 清除 Eddy TAP 产生的 G-code offset
    SET_GCODE_OFFSET X=0 Y=0 Z=0 MOVE=0

    # =========================================================
    # T1
    # =========================================================

    M118 [Eddy Z校准] 开始 T1 TAP...

    T1

    # 当前 T1 的旧偏移立即清除
    # 让 T1 与 T0 使用同一个机械坐标系
    SET_GCODE_OFFSET X=0 Y=0 Z=0 MOVE=0

    G90
    G1 X{status.cal_x} Y{status.cal_y} Z5 F6000

    PROBE_EDDY_NG_TAP HOME_Z=0

    _EDDY_Z_CAL_T1


#####################################################################
# T1 结果
#####################################################################

[gcode_macro _EDDY_Z_CAL_T1]
gcode:
    {% set status = printer["gcode_macro CALIBRATE_TOOL_Z_EDDY"] %}
    {% set raw_z = printer["btt_eddy"].last_tap_z|float %}
    {% set ref_z = status.ref_z|float %}
    {% set delta = raw_z - ref_z %}

    SET_GCODE_VARIABLE MACRO=CALIBRATE_TOOL_Z_EDDY VARIABLE=t1_z VALUE={delta}

    M118 [Eddy Z校准] T1 原始 TAP Z = {raw_z|round(6)}
    M118 [Eddy Z校准] T1 相对 T0 = {delta|round(6)} mm

    SET_GCODE_OFFSET X=0 Y=0 Z=0 MOVE=0

    # =========================================================
    # T2
    # =========================================================

    M118 [Eddy Z校准] 开始 T2 TAP...

    T2

    SET_GCODE_OFFSET X=0 Y=0 Z=0 MOVE=0

    G90
    G1 X{status.cal_x} Y{status.cal_y} Z5 F6000

    PROBE_EDDY_NG_TAP HOME_Z=0

    _EDDY_Z_CAL_T2


#####################################################################
# T2 结果
#####################################################################

[gcode_macro _EDDY_Z_CAL_T2]
gcode:
    {% set status = printer["gcode_macro CALIBRATE_TOOL_Z_EDDY"] %}
    {% set raw_z = printer["btt_eddy"].last_tap_z|float %}
    {% set ref_z = status.ref_z|float %}
    {% set delta = raw_z - ref_z %}

    SET_GCODE_VARIABLE MACRO=CALIBRATE_TOOL_Z_EDDY VARIABLE=t2_z VALUE={delta}

    M118 [Eddy Z校准] T2 原始 TAP Z = {raw_z|round(6)}
    M118 [Eddy Z校准] T2 相对 T0 = {delta|round(6)} mm

    SET_GCODE_OFFSET X=0 Y=0 Z=0 MOVE=0

    # =========================================================
    # T3
    # =========================================================

    M118 [Eddy Z校准] 开始 T3 TAP...

    T3

    SET_GCODE_OFFSET X=0 Y=0 Z=0 MOVE=0

    G90
    G1 X{status.cal_x} Y{status.cal_y} Z5 F6000

    PROBE_EDDY_NG_TAP HOME_Z=0

    _EDDY_Z_CAL_T3


#####################################################################
# T3 结果 + 最终保存
#####################################################################

[gcode_macro _EDDY_Z_CAL_T3]
gcode:
    {% set status = printer["gcode_macro CALIBRATE_TOOL_Z_EDDY"] %}
    {% set sv = printer.save_variables.variables %}

    {% set raw_z = printer["btt_eddy"].last_tap_z|float %}
    {% set ref_z = status.ref_z|float %}
    {% set delta = raw_z - ref_z %}

    SET_GCODE_VARIABLE MACRO=CALIBRATE_TOOL_Z_EDDY VARIABLE=t3_z VALUE={delta}

    M118 [Eddy Z校准] T3 原始 TAP Z = {raw_z|round(6)}
    M118 [Eddy Z校准] T3 相对 T0 = {delta|round(6)} mm

    # =========================================================
    # 计算最终结果
    # =========================================================

    {% set t1 = status.t1_z|float %}
    {% set t2 = status.t2_z|float %}
    {% set t3 = delta|float %}

    M118
    M118 ========================================================
    M118 [Eddy Z校准] 最终结果
    M118 --------------------------------------------------------
    M118 T0 Z = 0.000000
    M118 T1 Z = {t1|round(6)}
    M118 T2 Z = {t2|round(6)}
    M118 T3 Z = {t3|round(6)}
    M118 --------------------------------------------------------

    # =========================================================
    # 可选：保存到 myvariables.cfg
    # =========================================================

    {% if status.cal_save|int == 1 %}

        M118 [Eddy Z校准] 正在将结果保存到 myvariables.cfg...

        SAVE_VARIABLE VARIABLE=t0_offset_z VALUE=0.0
        SAVE_VARIABLE VARIABLE=t1_offset_z VALUE={t1}
        SAVE_VARIABLE VARIABLE=t2_offset_z VALUE={t2}
        SAVE_VARIABLE VARIABLE=t3_offset_z VALUE={t3}

        M118 [Eddy Z校准] T0/T1/T2/T3 Z偏移已保存。

    {% else %}

        M118 [Eddy Z校准] SAVE=0，仅显示结果，没有修改 myvariables.cfg。
        M118 [Eddy Z校准] 确认结果后，可使用 SAVE=1 重新执行保存。

    {% endif %}

    # =========================================================
    # 清除当前 TAP 产生的 G-code offset
    # =========================================================

    SET_GCODE_OFFSET X=0 Y=0 Z=0 MOVE=0

    # 最后回到 T0，避免校准结束时停留在 T3
    T0

    SET_GCODE_OFFSET X=0 Y=0 Z=0 MOVE=0

    # 关闭热端
    M104 S0 T0
    M104 S0 T1
    M104 S0 T2
    M104 S0 T3

    M118 [Eddy Z校准] 校准完成，当前工具：T0
    M118 [Eddy Z校准] 注意：Bed Mesh 已清除，需要重新建立网床。
    M118 ========================================================