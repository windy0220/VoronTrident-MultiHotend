[gcode_macro set_toolstatus_default]
description: 设置热端抓取状态为全部未抓取
gcode:


[gcode_macro set_toolchange_slow_test]
description: 热端模型切换为测试速度
gcode:
	SET_GCODE_VARIABLE MACRO=_toolchanger_cfg VARIABLE=feed_slow VALUE=100

[gcode_macro set_toolchange_slow_default]
description: 热端模型切换为正常速度
gcode:
	SET_GCODE_VARIABLE MACRO=_toolchanger_cfg VARIABLE=feed_slow VALUE=1000

#####################################################################
# 温度命令覆写：M104 / M109 默认作用于当前工具
#
#   覆写入口保留在配置中，原始 Klipper 命令会保留为 M99104 / M99109。
#   断料续打组实际工具解析由 [multitool] Python 辅助命令统一完成。
#
#   - 未传 T 时：当前有热端则用 current_tool；无热端则默认 T0。
#   - 若目标工具无耗材且在 continuation_groups 中，则复用
#     multitool_filament 的同一套续打组解析逻辑选择实际工具；普通降温也
#     会解析实际工具。组内无可用工具时，按传入工具执行。
#     只有断料续打内部关闭旧热端时会显式绕过该解析。
#   - M109 会先设温，再用 TEMPERATURE_WAIT 等待目标温度 ±1.5°C。
#   - 目标温度低于 50°C 时只设温不等待，避免 M109 S0 长时间等待冷却。
#####################################################################
# [gcode_macro M104]
# rename_existing: M99104
# gcode:
#     {% set s = params.S|default(0)|float %}
#     {% set r = params.R|default(0)|float %}
#     {% set target = s if s > 0 else r %}
#     {% set mt = printer.multitool %}
#     {% set requested = params.T|int if params.T is defined
#                      else (mt.current_tool|int if mt.current_tool|int >= 0 else 0) %}
#     MULTITOOL_SET_TEMPERATURE TOOL={requested} S={s} R={r} COMMAND=M104
#=================================================
# 9. 接管 M109 (加热并等待)
#=================================================
[gcode_macro M109]
rename_existing: M99109
gcode:
    {% set s = params.S|default(0)|float %}
    {% set r = params.R|default(0)|float %}
    {% set target_temp = s if s > 0 else r %}
    {% set tool_index = params.T|default(-1)|int %}
    {% set sensor_name = printer.toolhead.extruder %}

    # 修复：确保调用正确的宏变量名称 current_tool
    {% if tool_index == -1 %}
        {% set current_tool = printer["gcode_macro _tool_status"].current_tool|int %}
        {% set tool_index = current_tool %}
        M118 [M109 加热] 未指定T参数，默认加热当前挂载工具头: T{current_tool}
    {% endif %}

    {% if tool_index != -1 %}
        {% if tool_index == 0 %}
            {% set sensor_name = "extruder" %}
        {% else %}
            {% set sensor_name = "extruder" ~ tool_index %}
        {% endif %}
    {% endif %}

    {% if target_temp > 0 %}
        M118 [M109 加热] 开始将 {sensor_name} 加热至 {target_temp}℃，并等待稳定...
        {% if tool_index != -1 %}
            M104 S{target_temp} T{tool_index}
        {% else %}
            M104 S{target_temp}
        {% endif %}
        TEMPERATURE_WAIT SENSOR={sensor_name} MINIMUM={target_temp - 1.0}
        M118 [M109 加热] 温度已达标！
    {% endif %}

