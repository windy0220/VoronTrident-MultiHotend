[gcode_macro PAUSE]
rename_existing: BASE_PAUSE
gcode:
    # ----- 参数设置 -----
    {% set z_hop = 5.0 %}            ; 暂停时抬升的高度 (mm)
    {% set x_park = 280.0 %}         ; 停车位置 X 坐标
    {% set y_park = 40.0 %}          ; 停车位置 Y 坐标
    {% set retract_len = 0 %}        ; 暂停时的回抽长度 (mm)

    # 1. 保存暂停前 G-code 状态
    #    换头失败时，swap.cfg 会先恢复 tool_change 状态到换头前位置，
    #    因此这里保存的 PAUSE_state 就是正确的打印位置。
    SAVE_GCODE_STATE NAME=PAUSE_state

    # 2. 执行基础暂停
    BASE_PAUSE

    # 3. 安全回抽
    {% if printer.extruder.can_extrude and retract_len > 0 %}
        M83
        G1 E-{retract_len} F2100
    {% endif %}

    # 4. 计算安全 Z 抬升高度
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set cur_z = printer.toolhead.position.z|float %}
    {% if cur_z < (max_z - z_hop) %}
        {% set z_safe = z_hop %}
    {% else %}
        {% set z_safe = max_z - cur_z %}
    {% endif %}

    G91
    G1 Z{z_safe} F900

    # 5. 移动到侧边停车位置
    G90
    G1 Y{y_park} F5000
    G1 X{x_park} F5000

    # 6. 根据暂停原因显示提示
    {% set status = printer["gcode_macro _tool_status"] %}

    {% if status.recovery_pending|int == 1 %}
        {% if status.recovery_type|int == 1 %}
            M118 [系统] 换头失败：T{status.recovery_tool} 获取失败，打印已暂停。
            M118 [系统] 请将 T{status.recovery_tool} 正确放回停靠坞，确认传感器为 RELEASED 后点击“继续”。
        {% elif status.recovery_type|int == 2 %}
            M118 [系统] 换头失败：当前热端卸载失败，打印已暂停。
            M118 [系统] 请检查停靠坞与当前热端状态，然后点击“继续”重新尝试换头。
        {% else %}
            M118 [系统] 换头失败：未知恢复类型，打印已暂停。
            M118 [系统] 请人工检查工具头状态。
        {% endif %}
    {% else %}
        M118 [系统] 已安全停车，等待人工处理...
    {% endif %}

[gcode_macro RESUME]
rename_existing: BASE_RESUME
gcode:
    {% set retract_len = 0 %}        ; 必须与 PAUSE 中的回抽量一致
    {% set status = printer["gcode_macro _tool_status"] %}
    {% set recovery_pending = status.recovery_pending|int %}
    {% set recovery_type = status.recovery_type|int %}
    {% set recovery_tool = status.recovery_tool|int %}

    # =========================================================
    # 换头失败后的恢复流程
    # =========================================================
    {% if recovery_pending == 1 %}

        # -----------------------------------------------------
        # ① 获取工具失败
        # -----------------------------------------------------
        {% if recovery_type == 1 %}

            # 人工处理后，新工具应位于停靠坞内，此时传感器必须为 RELEASED。
            # 未释放时绝对不允许重新执行 T{recovery_tool}，避免再次撞入停靠坞。
            {% if printer["gcode_button tool_sensor"].state != "RELEASED" %}

                RESPOND TYPE=error MSG="[换头恢复] T{recovery_tool} 暂不能重新抓取：工具传感器仍为 PRESSED。"
                M118 [换头恢复] 请确认 T{recovery_tool} 已正确放入停靠坞，并确保传感器变为 RELEASED 后再次点击“继续”。

            {% else %}

                M118 [换头恢复] 正在恢复到换头失败前的打印位置...

                # 先回到暂停前位置。
                # 随后 _TOOL_CHANGE_RECOVER 会重新执行 T{recovery_tool}。
                RESTORE_GCODE_STATE NAME=PAUSE_state MOVE=1 MOVE_SPEED=150

                M118 [换头恢复] 正在重新尝试获取 T{recovery_tool}...

                # 不直接 BASE_RESUME。
                # 换头成功后由 swap.cfg 的 _FINISH_TOOL_PICKUP 自动恢复打印。
                _TOOL_CHANGE_RECOVER

            {% endif %}

        # -----------------------------------------------------
        # ② 卸载失败
        # -----------------------------------------------------
        {% elif recovery_type == 2 %}

            M118 [换头恢复] 正在恢复到换头失败前的打印位置...
            RESTORE_GCODE_STATE NAME=PAUSE_state MOVE=1 MOVE_SPEED=150

            M118 [换头恢复] 正在重新尝试完整换头流程...

            # 卸载失败时，当前工具通常仍然在机上。
            # _TOOL_CHANGE_RECOVER 会根据 recovery_tool 重新执行原目标 Txx，
            # 从而再次执行“卸载旧工具 → 抓取目标工具”的完整同步流程。
            # 成功后由 swap.cfg 的成功收尾宏自动恢复打印。
            _TOOL_CHANGE_RECOVER

        # -----------------------------------------------------
        # ③ 状态异常：拒绝直接恢复打印
        # -----------------------------------------------------
        {% else %}

            RESPOND TYPE=error MSG="[换头恢复] 检测到未知的换头恢复状态，拒绝直接恢复打印。"
            M118 [换头恢复] 请检查 _tool_status 的 recovery_type / recovery_tool 状态。

        {% endif %}

    # =========================================================
    # 普通暂停恢复
    # =========================================================
    {% else %}

        # 普通暂停时补回回抽
        {% if printer.extruder.can_extrude and retract_len > 0 %}
            M83
            G1 E{retract_len} F2100
        {% endif %}

        # 恢复暂停前 XYZ / G-code 状态
        RESTORE_GCODE_STATE NAME=PAUSE_state MOVE=1 MOVE_SPEED=150

        M118 [系统] 准备恢复打印...
        BASE_RESUME

    {% endif %}
    
[gcode_macro CANCEL_PRINT]
description: Cancel the actual running print
rename_existing: CANCEL_PRINT_BASE
gcode:
  TURN_OFF_HEATERS
  CANCEL_PRINT_BASE
  G91
  G1 Z10 F600 ; 抬高喷嘴10mm避免烫坏模型
  UNTOOL
  M106 S0

[gcode_macro CHECK_HOTEND_SWITCH]
description: 热端挂载检测开关
gcode:
    {% if printer["gcode_button tool_sensor"].state == "PRESSED" %}
        RESPOND MSG="✅ 热端已挂载到挤出机"
    {% else %}
        RESPOND MSG="❌ 热端已卸载"
    {% endif %}
