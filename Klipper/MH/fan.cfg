#####################################################################
#                            风扇配置                                # 
#####################################################################

[multi_pin part_fan]
pins:
    EBB:PA5,EBB:PD3
    
[fan]                        # 模型冷却风扇
pin: multi_pin:part_fan      # 信号接口
max_power: 1.0  
kick_start_time: 0.1         # 启动时间（勿动）
off_below: 0.10              # 勿动
shutdown_speed: 0
cycle_time: 0.005
#--------------------------------------------------------------------
[heater_fan hotend_fan]    
pin: EBB:PD2                 # 信号接口
max_power: 1              # 最大转速
kick_start_time: 0.1        # 启动时间(勿动)
heater: extruder,extruder1,extruder2,extruder3             # 关联的设备:挤出机
heater_temp: 50              # 挤出机达到多少度启动风扇
off_below: 0.10 
shutdown_speed: 1.0 
cycle_time: 0.005

#--------------------------------------------------------------------
[heater_fan dock_fan]    
pin: PF7                     # 信号接口
max_power: 0.5               # 最大转速
kick_start_time: 0.5         # 启动时间(勿动)
heater: extruder,extruder1,extruder2,extruder3              # 关联的设备:挤出机
heater_temp: 50              # 挤出机达到多少度启动风扇
shutdown_speed: 0
# fan_speed: 1.0               # 风扇转速
#--------------------------------------------------------------------
