[include mainsail.cfg]
[include MH/*.cfg]
[include ebb.cfg]
[include eddy.cfg]

[mcu host]
serial: /tmp/klipper_host_mcu

[mcu]
canbus_uuid:5a794774adc4

#####################################################################
# 打印机基础配置
#####################################################################

[printer]

kinematics: corexy # 定义机型
max_velocity: 500  # 工具头的最大速度（以mm/s计）。相对于打印件。
max_accel: 8000   			# 工具头的最大加速度（以mm/s^2计）。相对于打印件。
max_z_velocity: 15 			# Max 15 for 12V TMC Drivers, can increase for 24V 定义沿z轴运动的最大速度（单位：mm/s）。它限制了Z轴步进
max_z_accel: 350   # 定义沿Z轴运动的最大加速度（单位：mm/s^2）。
square_corner_velocity: 5.0 # 工具头可能以90度角度转角的最大速度（以mm/s计）。

[exclude_object]

[force_move]
enable_force_move: True

[respond]
default_type: echo
#   Sets the default prefix of the "M118" and "RESPOND" output to one
#   of the following:
#       echo: "echo: " (This is the default)
#       command: "// "
#       error: "!! "
default_prefix: echo:
#   Directly sets the default prefix. If present, this value will
#   override the "default_type".

#--------------------------------------------------------------------
# 	顶部照明
#--------------------------------------------------------------------
[neopixel top_leds]
pin: PD15
#   查看主板的接口图，找到对应的引脚
chain_count: 19
#   要控制的灯带的灯珠数量，应小于等于你灯带上串联的灯珠数
color_order: GRB
#   设置灯带RGB顺序，可用选项有GRB RGB, GRBW RGBW，默认是 GRB
initial_RED: 1.0
initial_GREEN: 1.0
initial_BLUE: 1.0
initial_WHITE: 0.0

#--------------------------------------------------------------------
# 	驱动器
#--------------------------------------------------------------------

[stepper_x]
step_pin: PE6
dir_pin: !PE5
enable_pin: !PC14
microsteps: 64
rotation_distance: 40
full_steps_per_rotation:200  #set to 400 for 0.9 degree stepper
# endstop_pin:PA14
endstop_pin: EBB:PA15
position_min: 0 
position_endstop: 299
position_max: 299

#--------------------------------------------------------------------
homing_speed: 60
homing_retract_dist: 5
second_homing_speed: 2

# uart设置
[tmc2209 stepper_x]
uart_pin: PC13
interpolate: False
run_current: 1.2 #   配置驱动器在步进电机移动期间使用的电流（以安培RMS为单位）。计算方式，额定电流*0.707=最大可用电流，设置为最大可用电流的 60%~70% 即可。雷赛42CM06 额定电流为 2.5 即 2.5*0.707*0.65 = 1.148875
# hold_current: 0.3
sense_resistor: 0.110
stealthchop_threshold: 0 #静音阈值 低于此值会启用静音模式

[stepper_y]
step_pin: PE2
dir_pin: !PE1
enable_pin: !PE4
microsteps: 64
rotation_distance: 40
full_steps_per_rotation:200  #set to 400 for 0.9 degree stepper
endstop_pin:PD12
position_min: 0
position_endstop:305
position_max:306.5

#--------------------------------------------------------------------
homing_speed: 80
homing_retract_dist:5
second_homing_speed: 2
# homing_positive_dir: false

# uart设置
[tmc2209 stepper_y]
uart_pin: PE3
interpolate: False
run_current: 1.2 #   配置驱动器在步进电机移动期间使用的电流（以安培RMS为单位）。
# hold_current: 0.3
sense_resistor: 0.110
stealthchop_threshold: 0

[stepper_z]
step_pin: PB8
dir_pin: PB7
enable_pin: !PE0
microsteps: 32
endstop_pin: probe:z_virtual_endstop
rotation_distance: 8 # Rotation Distance for TR8x8 = 8, TR8x4 = 4, TR8x2 = 2
position_max: 230 #最大有效距离
position_min: -5 # 用户可以命令步进器移动到的最小有效距离（以毫米为单位）。
homing_speed: 8 #步进器在归位时的最大速度（以毫米/秒为单位）
second_homing_speed: 2 #在进行第二次归位时步进器的速度（以毫米/秒为单位）。默认值是homing_speed的一半。
homing_retract_dist: 5.0 #在归位过程中第二次归位之前的后退距离（以毫米为单位）。

# uart设置
[tmc2209 stepper_z]
uart_pin: PB9
interpolate: False
run_current: 0.65
stealthchop_threshold: 50

[stepper_z1]
step_pin:PB4
dir_pin: !PB3
enable_pin:!PB6
microsteps: 32
rotation_distance: 8
# full_steps_per_rotation: 200
# gear_ratio: 80:16

[tmc2209 stepper_z1]
uart_pin: PB5
interpolate: False
run_current: 0.65
stealthchop_threshold: 50

[stepper_z2]
step_pin:PG13
dir_pin: !PG12
enable_pin:!PG15
microsteps: 32
rotation_distance: 8

[tmc2209 stepper_z2]
uart_pin: PG14
interpolate: False
run_current: 0.65
stealthchop_threshold: 50

#--------------------------------------------------------------------
# 	热床
#--------------------------------------------------------------------
[heater_bed]
heater_pin: PF5
sensor_type: NTC 100K MGB18-104F39050L32
sensor_pin: PB1
max_power: 1.0
# control = pid
# pid_kp = 41.989
# pid_ki = 0.361
# pid_kd = 1220.307
min_temp: 0
max_temp: 120

#--------------------------------------------------------------------
# 	风扇
#--------------------------------------------------------------------

# 过滤风扇
[heater_fan air_fan]
pin: PF6            # 替换为你的过滤风扇实际引脚
max_power: 1.0
shutdown_speed: 0
heater: heater_bed   # 监控的对象是热床
heater_temp: 90.0    # 触发阈值：90度
fan_speed: 1.0       # 开启时的风速（1.0 为全速）

#CB2 风扇
[temperature_fan cpu_fan]
pin: PF8
sensor_type: temperature_host
control: watermark  # 添加这个选项！
min_temp: 0
max_temp: 120
target_temp: 60
min_speed: 0
max_speed: 0.8
max_delta: 2.0
shutdown_speed: 0
kick_start_time: 0.5

# 主板mcu风扇
[temperature_fan mcu_fan]
pin: PF9
sensor_type: temperature_mcu
control: watermark  # 添加这个选项！
min_temp: 0
max_temp: 120
target_temp: 60
min_speed: 0
max_speed: 0.7
max_delta: 2.0
shutdown_speed: 0
kick_start_time: 0.5

# 驱动风扇
[controller_fan stepper_drive_fan]
pin: PA4
max_power: 0.7
shutdown_speed: 0
kick_start_time: 0.5
stepper: stepper_x, stepper_y, stepper_z  # 监听这些驱动器的状态
idle_timeout: 30       # 驱动器停止后风扇继续转动的时间（秒）
idle_speed: 0.4        # 待机时的风扇转速（可选）

#####################################################################
#	无动作超时操作
#####################################################################
[idle_timeout]
gcode:
    # _status_off
    TURN_OFF_HEATERS
    M84
#   在空闲超时时执行的一系列 G-Code 命令。G-Code 格式请见
timeout: 600
#   在执行以上 G-Code 前等待的空闲时间（以秒为单位）

#####################################################################
#	z轴归位
#####################################################################
# [safe_z_home]
# home_xy_position: 150,150 # z限位的位置
# speed: 100 #工具头移动到安全Z原点的速度。
# z_hop: 10
# #   在归位前抬升Z轴的距离（mm）。这将用于任何归位命令，即使
# z_hop_speed: 10
# #   在归位之前，Z轴抬升的速度（单位：mm/s）。

[homing_override]
axes: z
set_position_z: 0                 
gcode:
    G91
    G1 Z10 F600   
    G90 

    # 检查 Y 是否回零，如果没有则回零
    {% if "Y" not in printer.toolhead.homed_axes %}
        G28 Y
        G91
        G1 Y-10 F9000
        G90
    {% endif %}
    M400
    # 检查 X 是否回零，如果没有则回零
    {% if "X" not in printer.toolhead.homed_axes %}
        G28 X
         G91
        G1 X-10 F9000
        G90
    {% endif %}

    UNTOOL  # 执行你的卸载工具宏

    # 移动到热床中间进行 Z 回零（请根据你的床尺寸调整 X150 Y150）
    G0 X{ printer.toolhead.axis_maximum.x/2 } Y{ printer.toolhead.axis_maximum.y/2 } F6000

    # 正式执行 Z 回零
    G28 Z

    # 归位后稍微抬升一点
    G1 Z10 F600


#####################################################################
# 	开始打印宏
#####################################################################
[gcode_macro PRINT_START]
gcode:
    # # 获取参数
    # {% set BED_TEMP = params.BED|default(60)|float %}
    # {% set EXTRUDER_TEMP = params.EXTRUDER|default(190)|float %}

    # ==========================================
    # 1. 接收切片软件传来的参数
    # ==========================================
    {% set BED_TEMP = params.BED|default(60)|float %}            
    
    # 重点：接收初始喷头编号，并转为字符串方便后面比对
    {% set INITIAL_TOOL = params.INITIAL_TOOL|default("0")|string %} 
    
    {% set tools_str = params.TOOLS|default("0,")|string %}
    {% set tool_list = tools_str.split(',') %}
    {% set temps_str = params.TEMPS|default("200,")|string %}
    {% set temp_list = temps_str.split(',') %}

    {% set start_x = params.START_X|default(50.0)|float %}
    {% set start_y = params.START_Y|default(45.0)|float %}
    {% set offset_y = params.OFFSET_Y|default(5.0)|float %}
    {% set prime_length = params.LENGTH|default(200.0)|float %}
    {% set pre_extrude = params.PRE_EXTRUDE|default(3.0)|float %}

	# 这些是调试参数用于检查 切片软件传过来的参数。

   #    RESPOND MSG="BED_TEMP={BED_TEMP}"
   #    RESPOND MSG="INITIAL_TOOL={INITIAL_TOOL}"
   #    RESPOND MSG="TOOLS={tools_str}"
   #    RESPOND MSG="TEMPS={temps_str}"
   #    RESPOND MSG="tool_list={tool_list}"
   #    RESPOND MSG="temp_list={temp_list}"
   #    RESPOND MSG="start_x={start_x}"
   #    RESPOND MSG="start_y={start_y}"
   #    { action_raise_error("Error message") }

     # ==========================================
    # 2. 预热热床与机器归零调平
    # ==========================================
    G28
    BED_MESH_CLEAR
    # 开始加热热床
    M140 S{BED_TEMP}          

    # 3Z调平
    Z_TILT_ADJUST
    
    # 网床 这里使用了EDDY进行扫床。  METHOD=rapid_scan 为扫床 ADAPTIVE=1 为自适应网床
    BED_MESH_CALIBRATE METHOD=rapid_scan ADAPTIVE=1

    # 使用EDDY-NG 进行精确Z归位，这里必须获取一个工具头
    T{INITIAL_TOOL}
    G1 X150 Y150 F6000
    PROBE_EDDY_NG_TAP
    UNTOOL

    # 等待热床加热至指定温度
    M190 S{BED_TEMP}          

    # ==========================================
    # 3. 按独立温度加热所有【用到】的喷头
    # ==========================================
    {% for i in range(tool_list|length) %}
        {% if tool_list[i] != "" and temp_list[i] != "" %}
            M104 S{temp_list[i]} T{tool_list[i]}
        {% endif %}
    {% endfor %}

    {% for i in range(tool_list|length) %}
        {% if tool_list[i] != "" and temp_list[i] != "" %}
            M109 S{temp_list[i]} T{tool_list[i]}
        {% endif %}
    {% endfor %}

    # ==========================================
    # 4. 依次切换喷头并进行边缘划线
    # ==========================================
    SAVE_GCODE_STATE NAME=print_start_state
    G90 
    G92 E0 

    {% set ns = namespace(line_index=0) %}

    # ----- 第 1 步：先给【非初始头】划线 -----
    {% for tool in tool_list %}
        # 只要不是空值，且【不是初始头】，就先给它划线
        {% if tool != "" and tool != INITIAL_TOOL %}
            T{tool}
            {% set current_y = start_y + (ns.line_index * offset_y) %}
            G1 Z5.0 F3000
            G1 X{start_x} Y{current_y} F6000
            G1 Z0.28 F1500
            G91 
            G1 E{pre_extrude} F300 
            G1 X{prime_length * 0.6} E{prime_length * 0.12} F1000 
            G1 X{prime_length * 0.4} E{prime_length * 0.05} F1500 
            G1 E-1.5 F2100 
            G1 Z2.0 F3000
            G90
            G92 E0
            M104 S0 T{tool}
            {% set ns.line_index = ns.line_index + 1 %}
        {% endif %}
    {% endfor %}

    # ----- 第 2 步：最后给【初始头】划线 -----
    # 确保切片传来的初始头确实在用到的列表里，然后最后拿起它划线
    {% if INITIAL_TOOL in tool_list %}
        T{INITIAL_TOOL}
        {% set current_y = start_y + (ns.line_index * offset_y) %}
        G1 Z5.0 F3000
        G1 X{start_x} Y{current_y} F6000
        G1 Z0.28 F1500
        G91 
        G1 E{pre_extrude} F300 
        G1 X{prime_length * 0.6} E{prime_length * 0.12} F1000 
        G1 X{prime_length * 0.4} E{prime_length * 0.05} F1500 
        G1 E0 F2100 
        G1 Z2.0 F3000
        G90
        G92 E0
        # 这里划完线之后，机器正好拿的就是初始头！
    {% endif %}

   # ==========================================
    # 5. 恢复状态，交给切片软件接管
    # ==========================================
    RESTORE_GCODE_STATE NAME=print_start_state
    
    {% if INITIAL_TOOL in tool_list %}
        {% set svv = printer.save_variables.variables %}
        {% set off_x = svv["t" ~ INITIAL_TOOL ~ "_offset_x"] | default(0.0) | float %}
        {% set off_y = svv["t" ~ INITIAL_TOOL ~ "_offset_y"] | default(0.0) | float %}
        {% set off_z = svv["t" ~ INITIAL_TOOL ~ "_offset_z"] | default(0.0) | float %}
        
        SET_GCODE_OFFSET X={off_x} Y={off_y} Z={off_z} MOVE=0
        
        { action_respond_info("初始头 T" ~ INITIAL_TOOL ~ " 已从外部文件应用偏移。") }
    {% endif %}
   
    { action_respond_info("划线结束。目前喷头为 T" ~ INITIAL_TOOL ~ "，已重新加载坐标偏移，准备直接打印！") }

#####################################################################
# 	工具宏
#####################################################################
#开启圆弧拟合 设置此选项后将支持切片软件中的圆弧拟合功能，即G2/G3命令
[gcode_arcs]
resolution: 0.1 #数值越小精度越高，如上位机频繁报错轻改大改数值，比如0.25


# 	打印结束
[gcode_macro PRINT_END]
description: 打印结束宏：卸载工具、关闭加热、热床降到底部方便取模
gcode:
    # 1. 获取机器定义的范围
    {% set max_x = printer.configfile.config["stepper_x"]["position_max"]|float %}
    {% set max_y = printer.configfile.config["stepper_y"]["position_max"]|float %}
    {% set max_z = printer.configfile.config["stepper_z"]["position_max"]|float %}
    
    # 2. 卸载工具头并重置偏移量
    UNTOOL
    SET_GCODE_OFFSET X=0 Y=0 Z=0 

    M400                              # 等待缓冲区清除
    G92 E0                            # 将挤出机计数归零
    
    # 3. 先进行安全小抬升 (相对坐标)
    G91                               # 相对定位
    # 向上抬升 5mm (如果没超过最大高度的话)
    {% if printer.toolhead.position.z < (max_z - 5) %}
        G0 Z5 F3600 
    {% endif %}
    
    # 4. 关闭所有加热源和风扇
    M104 S0 T0                        
    M104 S0 T1                        
    M104 S0 T2                        
    M104 S0 T3                        
    M140 S0                           # 关闭热床
    M106 S0                           # 关闭模型风扇
    
    # 5. 执行“取模位”移动 (绝对坐标)
    G90                               # 切换回绝对坐标
    {% set safe_z = max_z - 10 %}
    
    G0 X{max_x} Y{max_y} Z{safe_z} F6000
    
    # 6. 后期处理
    M400                              # 等待移动完成
    BED_MESH_CLEAR                    # 卸载网床
    PROBE_EDDY_NG_SET_TAP_OFFSET VALUE=0 ;清理eddy-ng 偏移量
    # M84                             # 可选：如果你想手动取模更轻松，可以取消注释这行关闭电机
    
    { action_respond_info("打印完成！热床已降下，请取模。") }

[virtual_sdcard]
path: ~/printer_data/gcodes

[gcode_macro GOTO_CENTER]
gcode:
    g0 x150 y150 F3600

[display_status]

# 初始化代码
[delayed_gcode my_startup_gcode]
initial_duration: 1.0
gcode:
    # _status_ready
    # _hbb_status_ready


# eddy z倾斜调整，先在8mm米做一次避免撞床，然后在2mm 进行精确调整
[gcode_macro Z_TILT_ADJUST]
rename_existing: _Z_TILT_ADJUST
gcode:
    SAVE_GCODE_STATE NAME=STATE_Z_TILT
    BED_MESH_CLEAR
    {% if not printer.z_tilt.applied %}
    _Z_TILT_ADJUST horizontal_move_z=8 retry_tolerance=1
    {% endif %}
    _Z_TILT_ADJUST horizontal_move_z=2
    RESTORE_GCODE_STATE NAME=STATE_Z_TILT

# 手动执行网床
[gcode_macro AUTO_BED_MESH]
gcode:
    {% if 'x' not in printer.toolhead.homed_axes or 'y' not in printer.toolhead.homed_axes  or 'z' not in printer.toolhead.homed_axes %}
         G28
    {% endif %}
    Z_TILT_ADJUST
    BED_MESH_CALIBRATE METHOD=rapid_scan

