# eddy coil 配置文件
[probe_eddy_ng btt_eddy]
sensor_type: ldc1612
# z_offset: 1
i2c_mcu: EBB
i2c_software_scl_pin: EBB:PA7
i2c_software_sda_pin: EBB:PA6
# i2c_bus: i2c0f
x_offset: 0
y_offset: 31.77
# tap_target_z: -2.0

# eddy duo
# [mcu eddy]
# # FOR USB: replace this with your serial port ID
# # FOR CANBUS: replace this with your canbus UUID
# serial: /dev/serial/by-id/usb-Klipper_rp2040_5044340408C2531C-if00
# restart_method: command

# [probe_eddy_ng btt_eddy]
# sensor_type: btt_eddy
# i2c_mcu: eddy
# i2c_bus: i2c0f
# x_offset: 0
# y_offset: 20

# [temperature_sensor btt_eddy_mcu]
# sensor_type: temperature_mcu
# sensor_mcu: eddy
# min_temp: 10
# max_temp: 100

# [temperature_sensor btt_eddy]
# sensor_type: Generic 3950
# sensor_pin: eddy:gpio26

#----------------------------

[z_tilt]
z_positions: #定义丝杆的位置 
  -50, 18
  150, 348
  350, 18
points: #测量点的位置 
  30, 50
  150, 245
  270, 50
  
speed: 200 # 切换点位时移动的速度
# horizontal_move_z: 15 # 切换点位时平台下移的高度，如果此值过低，平台倾斜又较大，可能会调平失败
retries: 5 # 调平最多运行的次数
retry_tolerance: 0.02 # 调平的目标精度，小于此值时则停止调平


[bed_mesh]
horizontal_move_z: 2
speed: 180
mesh_min: 20, 77  # modify these according to the above guide. If the probe cannot reach then you will get a klipper error when trying to scan a bed mesh.
mesh_max: 280, 280 # modify these according to the above guide. If the probe cannot reach then you will get a klipper error when trying to scan a bed mesh.
probe_count: 10, 10
mesh_pps: 0, 0
algorithm: bicubic
zero_reference_position: 150,150 # 相对零点 即热床中心位置
scan_overshoot:8

fade_start: 0.6 # 网格淡出起始点 从0.6mm 处开始进行网格淡出 
fade_end: 10.0 # 网格淡出结束点 到10mm 处网格补偿归零

# 定义故障区域：如果扫描过程中 Eddy 意外进入此区域，Klipper 会尝试插值处理
# 格式：min_x, min_y, max_x, max_y
# faulty_region_1_min: 0, 0
# faulty_region_1_max: 23, 30

