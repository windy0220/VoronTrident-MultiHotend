# eddy coil 配置文件
[probe_eddy_current btt_eddy]
sensor_type: ldc1612
descend_z: 2.5 #归位是喷头距离热床的高度
i2c_mcu: EBB
i2c_software_scl_pin: EBB:PA7
i2c_software_sda_pin: EBB:PA6
x_offset: 0
y_offset: 31.77
speed: 5
samples: 3
sample_retract_dist: 5.0
samples_tolerance: 0.05
samples_tolerance_retries: 3
tap_z_offset: -0.175 # 减是抬升 加是压紧
frequency: 12000000
max_sensor_hz: 5000000

# eddy duo
# [mcu eddy]
# # FOR USB: replace this with your serial port ID
# # FOR CANBUS: replace this with your canbus UUID
# serial: /dev/serial/by-id/usb-Klipper_rp2040_5044340408C2531C-if00
# restart_method: command

# [probe_eddy_ng btt_eddy]
# sensor_type: btt_eddy
# i2c_mcu: eddy
# i2c_bus: i2c0f
# x_offset: 0
# y_offset: 20

# [temperature_sensor btt_eddy_mcu]
