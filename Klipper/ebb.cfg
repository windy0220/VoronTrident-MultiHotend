
[mcu EBB]
canbus_uuid:98013eadc96f

[temperature_sensor EBB]
sensor_type: Generic 3950
sensor_pin: EBB:PA0
pullup_resistor: 2200

[lis2dw]
cs_pin: EBB:PB1
spi_bus:spi2_PB2_PB11_PB10
axes_map: x,y,z

[resonance_tester]
accel_chip: lis2dw
probe_points:
    # 打印床中间稍上方的某个位置
    150, 150, 20

