#####################################################################
# 持久化变量
#####################################################################
[save_variables]
filename: ~/printer_data/config/myvariables.cfg

#=================================================
# 开机恢复上一次记录的工具状态
#=================================================
[delayed_gcode RESTORE_TOOL_STATUS]
initial_duration: 0.1
gcode:
    {% set svv = printer.save_variables.variables %}
    {% if svv.current_tool is defined %}
        SET_GCODE_VARIABLE MACRO=_tool_status VARIABLE=current_tool VALUE={svv.current_tool}
        M118 [系统启动] 已恢复上一次的工具状态: T{svv.current_tool}
    {% else %}
        M118 [系统启动] 未找到历史工具状态，默认为无工具状态
    {% endif %}

#=================================================
# 工具头状态检测传感器
# 说明：此传感器仅用于判断工具头
#       1. 抓取后：是否已经成功装上工具头（PRESSED）
#       2. 卸载后：是否已经成功释放工具头（RELEASED）
# 不再作为耗材断料/用尽检测，也不会触发自动暂停。
#=================================================
[gcode_button tool_sensor]
pin: EBB:PD0
debounce_delay: 0.1
press_gcode:
    # M118 [工具传感器] 状态=PRESSED
release_gcode:
    # M118 [工具传感器] 状态=RELEASED

#=================================================
# 1. 参数集中管理
#=================================================
[gcode_macro _toolchanger_cfg]
description: 工具切换参数配置

# --- 换刀抬升与速度与加速度 ---
variable_z_hop:            0.4   # 换头抬升高度
variable_feed_z:           600   # 抬升速度
variable_feed_fast:        10000 # 工作速度（空驶）
# variable_feed_fast:       1000  # 测试速度
variable_feed_slow:        1000  # 工作速度（受力）
# variable_feed_slow:        80  # 测试速度（受力）
variable_accel_toolchange: 2000  # 换头时的加速度 

# --- 换刀回抽/清洗配置 ---
variable_pickup_retract_len: 1  # [抓取工具] 夹紧后、离开停靠坞前回抽量 (mm)，防止去模型途中漏料 （！！！记得在切片软件换头回抽补偿那里额外挤出补偿相同长度！！！）
variable_swap_retract_len: 0.2      # [释放工具] 放回底座时的回抽量 (mm)，防止漏料
variable_swap_prime_len:   2      # [抓取工具] 抓取时的挤出量 (mm)，用于清洗或补偿
variable_swap_retract_spd: 2000   # 挤出/回抽的进给速度 (mm/min)

# --- 换头结果验证开关 ---
# 1 = 开启：验证抓取/卸载是否成功
# 0 = 关闭：跳过抓取/卸载传感器验证（调试用）
variable_enable_sensor_check: 1

# ========================================================
# 【停靠坞运动逻辑参数】
# ========================================================
variable_dock_shift_x: -3   # 横移开挤出机距离
variable_dock_dodge_y: 15     # 避让动作的 Y 轴相对位移
variable_dock_safe_y:  40     # 安全拔出的 Y 轴相对位移

#---------------------------------------------------------
# 各热端参数配置
#---------------------------------------------------------
# T0 配置
variable_t0_dock_x: 13.3     # T0 热端进入停靠坞大孔X坐标 横移到x8 固定 X: 10.74 mm Y: 3.93 mm | X: 10.60 mm  Y: 4.61 mm | X: 10.59 mm  Y: 4.42 mm |
variable_t0_dock_y: 4.2     # T0 热端进入停靠坞大孔Y坐标

# T1 配置
variable_t1_dock_x: 68    # 65.4 4.26 | 65.00 mm  4.41 mm | X: 64.99 mm Y: 5.19 mm | X: 65.00 mm Y: 4.94 mm  
variable_t1_dock_y: 4.67

# T2 配置
variable_t2_dock_x: 122.8   # 120 4.63  120.20 mm 5.45 mm
variable_t2_dock_y: 4.8

# T3 配置 
variable_t3_dock_x: 177  # X: 175.00 mm Y: 5.36 mm
variable_t3_dock_y: 4.8

# T4 配置
variable_t4_dock_x:232.2
variable_t4_dock_y:4.8

gcode:
   # 仅用于存储变量，不需要执行内容

#=================================================
# 2. 切换热端命令 (用户级指令)
#=================================================
[gcode_macro T0]
gcode: change_tool T=0

[gcode_macro T1]
gcode: change_tool T=1

[gcode_macro T2]
gcode: change_tool T=2

[gcode_macro T3]
gcode: change_tool T=3

[gcode_macro T4]
gcode: change_tool T=4

[gcode_macro UNTOOL]
description: 卸载当前热端，变为空载状态
gcode: change_tool T=-1

#=================================================
# 换头失败后的恢复入口
# 由外部自定义 RESUME 宏调用。
# 不在这里调用 BASE_RESUME；换头成功后由成功收尾宏自动恢复打印。
#=================================================
[gcode_macro _TOOL_CHANGE_RECOVER]
description: 换头失败暂停后的重新换头入口
gcode:
    {% set status = printer["gcode_macro _tool_status"] %}
    {% set recovery_pending = status.recovery_pending|int %}
    {% set recovery_tool = status.recovery_tool|int %}

    {% if recovery_pending == 1 %}

        # 清除本次恢复前的失败锁存，允许重新验证并在再次失败时重新报告。
        SET_GCODE_VARIABLE MACRO=_tool_status VARIABLE=failure_reported VALUE=0
        SET_GCODE_VARIABLE MACRO=_tool_status VARIABLE=recovery_running VALUE=1

        {% if recovery_tool >= 0 %}
            M118 [换头恢复] 已收到继续指令，重新尝试获取 T{recovery_tool}...
            T{recovery_tool}
        {% else %}
            M118 [换头恢复] 已收到继续指令，重新尝试卸载当前工具头...
            UNTOOL
        {% endif %}

        # 注意：这里故意不 BASE_RESUME。
        # 成功后 _FINISH_TOOL_PICKUP / _FINISH_TOOL_UNLOAD 会恢复 PAUSE_state 并继续打印。

    {% else %}
        M118 [换头恢复] 当前没有待恢复的换头事务。
    {% endif %}

#=================================================
# 3. 状态变量存储 (运行时记录)
#=================================================
[gcode_macro _tool_status]
variable_current_tool: -1
# 当前换头事务目标工具；-1 表示最终目标为空载
variable_pending_tool: -1
# 换头前保存的加速度，用于成功/失败后恢复
variable_saved_accel: 0
# 失败处理锁存：同一次换头事务最多报告一次最终失败
variable_failure_reported: 0

# =========================================================
# 打印中换头失败后的恢复状态
# recovery_pending = 1 表示上一次暂停是由换头失败引起，
# 用户点击 RESUME 时必须先重新执行失败的换头目标。
# =========================================================
variable_recovery_pending: 0
# 需要重新尝试的目标工具；-1 表示目标为空载（UNTOOL）
variable_recovery_tool: -1
# 1 = 抓取失败，2 = 卸载失败
variable_recovery_type: 0
# 1 = 当前正在执行失败后的恢复重试
# 用于防止 change_tool 在恢复时清除 recovery 状态。
variable_recovery_running: 0
gcode:

#=================================================
# 4. 释放热端动作 (底层动作宏)
#=================================================
[gcode_macro _release_tool]
gcode:
    {% set cfg = printer["gcode_macro _toolchanger_cfg"] %}
    {% set tool = params.TOOL|int %}
    {% set prefix = "t" ~ tool %}
    {% set active_extruder = printer.toolhead.extruder %}
    
    # 提取当前喷头的停靠参数
    {% set dock_x = cfg[prefix + "_dock_x"] %}
    {% set dock_y = cfg[prefix + "_dock_y"] %}
    {% set shift_x = cfg.dock_shift_x %}
    {% set dodge_y = cfg.dock_dodge_y %}
    {% set safe_y  = cfg.dock_safe_y %}

    M118 --- [T{tool} 释放] 启动释放流程...

    # --- [A] 释放回抽 (防止底座溢料) ---
    {% set cur_temp = printer[active_extruder].temperature|float %}
    # {% set min_temp = printer.configfile.settings[active_extruder].min_extrude_temp|default(170)|float %}
    {% set min_temp = 170 %}

	M118 --- [T{tool} 释放] cur_temp:({ cur_temp }), min_temp:({ min_temp })
    
    {% if cur_temp >= min_temp %}
       M118 --- [T{tool} 释放] 温度达标，正在执行释放前回抽...
       M83  
       G1 E-{cfg.swap_retract_len} F{cfg.swap_retract_spd} 
    {% else %}
       M118 --- [T{tool} 释放] 当前温度({cur_temp}℃)过低，跳过回抽操作
    {% endif %}

    # --- 开始释放物理动作 ---
    G90 
    
    # M118 --- [T{tool} 释放] 步骤1: 移动到停靠坞前方安全入口
    G0 Y{dock_y + safe_y} F{cfg.feed_fast}
    G0 X{dock_x} F{cfg.feed_fast}
    
    # M118 --- [T{tool} 释放] 步骤2: 直线推入停靠坞底座
    G0 X{dock_x} Y{dock_y} F{cfg.feed_fast}
    
    # M118 --- [T{tool} 释放] 步骤3: X轴横移，打开挤出机摆臂
    G0 X{dock_x + shift_x} Y{dock_y} F{cfg.feed_slow}
    
    # M118 --- [T{tool} 释放] 步骤4: Y轴拔出，断开工具磁吸
    G0 X{dock_x + shift_x} Y{dock_y + dodge_y} F{cfg.feed_slow}
    
    # M118 --- [T{tool} 释放] 步骤5: 反向横移，安全闭合挤出机摆臂
    G0 X{dock_x} Y{dock_y + dodge_y} F{cfg.feed_slow}
    
    # M118 --- [T{tool} 释放] 步骤6: 退回安全入口，释放完成
    G0 X{dock_x} Y{dock_y + safe_y} F{cfg.feed_fast}

#=================================================
# 5. 抓取热端动作 (底层动作宏)
#=================================================
[gcode_macro _pickup_tool]
gcode:
    {% set cfg = printer["gcode_macro _toolchanger_cfg"] %}
    {% set tool = params.TOOL|int %}
    {% set prefix = "t" ~ tool %}
    {% set current_heater = "extruder" if tool == 0 else ("extruder" ~ tool) %}
    
    {% set dock_x = cfg[prefix + "_dock_x"] %}
    {% set dock_y = cfg[prefix + "_dock_y"] %}
    {% set shift_x = cfg.dock_shift_x %} # -3
    {% set dodge_y = cfg.dock_dodge_y %} # 14
    {% set safe_y  = cfg.dock_safe_y %}  # 40

    M118 +++ [T{tool} 抓取] 启动抓取流程...
    
    # --- 开始抓取物理动作 ---
    G90
    
    # M118 +++ [T{tool} 抓取] 步骤1: 移动到停靠坞前方安全入口
    G0 Y{dock_y + safe_y} F{cfg.feed_fast} # x13.6 Y45
    G0 X{dock_x} F{cfg.feed_fast}
    
    # M118 +++ [T{tool} 抓取] 步骤2: 进入避让位置 (避免撞到停靠的热端)
    G0 X{dock_x} Y{dock_y + dodge_y} F{cfg.feed_fast}  # x13.6 Y19
    
    # M118 +++ [T{tool} 抓取] 步骤3: X轴横移，准备切入
    G0 X{dock_x + shift_x} Y{dock_y + dodge_y} F{cfg.feed_slow} #X10.6 Y19
    
    # M118 +++ [T{tool} 抓取] 步骤4: 推入底座，磁吸结合
    G0 X{dock_x + shift_x} Y{dock_y} F{cfg.feed_slow} #X10.6 Y5
    
    # M118 +++ [T{tool} 抓取] 步骤5: 反向横移，夹紧耗材丝 
    G0 X{dock_x} Y{dock_y} F{cfg.feed_slow} # X13.6 Y5
    
    # --- 停靠坞内挤出补偿 ---
    {% set cur_temp = printer[current_heater].temperature|float %}
    # {% set min_temp = printer.configfile.settings[current_heater].min_extrude_temp|default(170)|float %}
    {% set min_temp = 170 %}
    
    
    {% if cur_temp >= min_temp %}
         M118 +++ [T{tool} 抓取] 温度达标，正在执行抓取补偿挤出...
         M83 
         G1 E{cfg.swap_prime_len} F{cfg.swap_retract_spd} 
    {% else %}
         M118 +++ [T{tool} 抓取] 当前温度({cur_temp}℃)过低，跳过补偿挤出
    {% endif %}

    # --- [新增] 夹紧后回抽，防止离开停靠坞到模型途中漏料 ---
    {% if cur_temp >= min_temp and cfg.pickup_retract_len > 0 %}
     M118 +++ [T{tool} 抓取] 执行抓取后回抽 {cfg.pickup_retract_len}mm，防止途中漏料...
     M83
     G1 E-{cfg.pickup_retract_len} F{cfg.swap_retract_spd}
    {% endif %}

    M118 +++ [T{tool} 抓取] 步骤6: 带着工具退回安全入口，抓取完成
    G0 X{dock_x} Y{dock_y + safe_y} F{cfg.feed_fast}
    
#=================================================
# 6. 同步换头验证与固定重试
#
# 重要：这些宏故意拆成“动作宏”和“检查宏”两层。
# G-code 宏中的 Jinja 条件会在该宏展开时读取状态，所以不能在同一个
# 宏里先运动、再立即用 Jinja 判断传感器；这里通过独立检查宏 + M400/G4
# 保证检查时读取到的是动作完成后的真实传感器状态。
#
# 重试策略：
#   第1次失败 -> 第2次完整重试
#   第2次仍失败 -> G28 Y -> G28 X -> 第3次完整重试
#   每次抓取前还必须确认工具传感器=RELEASED；否则立即禁止抓取，避免撞到已存在的工具头。
#   该“抓取前安全互锁”不受 enable_sensor_check 开关影响，始终有效。
#   第3次仍失败 -> 打印中 PAUSE；非打印状态报错并结束当前宏事务
#
# 整个流程保持同步，不使用 delayed_gcode，也不递归调用检查宏。
#=================================================

#-------------------------------------------------
# 6.1 卸载：第1次 / 第2次 / 第3次动作
#-------------------------------------------------
[gcode_macro _RELEASE_TOOL_ATTEMPT_1]
gcode:
    _release_tool TOOL={printer["gcode_macro _tool_status"].current_tool|int}
    M400
    G4 P200
    _CHECK_RELEASE_TOOL_1

[gcode_macro _RELEASE_TOOL_ATTEMPT_2]
gcode:
    M118 [换头验证] 卸载第1次失败，执行第2次卸载尝试...
    _release_tool TOOL={printer["gcode_macro _tool_status"].current_tool|int}
    M400
    G4 P200
    _CHECK_RELEASE_TOOL_2

[gcode_macro _RELEASE_TOOL_ATTEMPT_3]
gcode:
    M118 [换头验证] 卸载第2次仍失败，先执行 Y→X 归位后进行第3次卸载...
    G28 Y
    G28 X
    _release_tool TOOL={printer["gcode_macro _tool_status"].current_tool|int}
    M400
    G4 P200
    _CHECK_RELEASE_TOOL_3

#-------------------------------------------------
# 6.2 卸载：第1/2/3次结果检查
#-------------------------------------------------
[gcode_macro _CHECK_RELEASE_TOOL_1]
gcode:
    {% set cfg = printer["gcode_macro _toolchanger_cfg"] %}
    {% if cfg.enable_sensor_check|int == 0 %}
        M118 [换头验证] 工具传感器验证已关闭，视为卸载成功。
        _AFTER_RELEASE_SUCCESS
    {% elif printer["gcode_button tool_sensor"].state == "RELEASED" %}
        M118 [换头验证] 第1次卸载确认成功：传感器=RELEASED。
        _AFTER_RELEASE_SUCCESS
    {% else %}
        M118 [换头验证] 第1次卸载失败：传感器仍为PRESSED。
        _RELEASE_TOOL_ATTEMPT_2
    {% endif %}

[gcode_macro _CHECK_RELEASE_TOOL_2]
gcode:
    {% set cfg = printer["gcode_macro _toolchanger_cfg"] %}
    {% if cfg.enable_sensor_check|int == 0 %}
        M118 [换头验证] 工具传感器验证已关闭，视为卸载成功。
        _AFTER_RELEASE_SUCCESS
    {% elif printer["gcode_button tool_sensor"].state == "RELEASED" %}
        M118 [换头验证] 第2次卸载确认成功：传感器=RELEASED。
        _AFTER_RELEASE_SUCCESS
    {% else %}
        M118 [换头验证] 第2次卸载失败：传感器仍为PRESSED。
        _RELEASE_TOOL_ATTEMPT_3
    {% endif %}

[gcode_macro _CHECK_RELEASE_TOOL_3]
gcode:
    {% set cfg = printer["gcode_macro _toolchanger_cfg"] %}
    {% if cfg.enable_sensor_check|int == 0 %}
        M118 [换头验证] 工具传感器验证已关闭，视为卸载成功。
        _AFTER_RELEASE_SUCCESS
    {% elif printer["gcode_button tool_sensor"].state == "RELEASED" %}
        M118 [换头验证] 第3次卸载确认成功：传感器=RELEASED。
        _AFTER_RELEASE_SUCCESS
    {% else %}
        M118 [换头验证] !!! 第3次卸载仍失败：传感器=PRESSED。
        _TOOL_CHANGE_FAILURE TYPE=UNLOAD
    {% endif %}

#-------------------------------------------------
# 6.3 卸载完成后：决定是否进入抓取
#-------------------------------------------------
[gcode_macro _AFTER_RELEASE_SUCCESS]
gcode:
    {% set new_tool = printer["gcode_macro _tool_status"].pending_tool|int %}
    {% set cfg = printer["gcode_macro _toolchanger_cfg"] %}

    # 旧工具已经通过传感器确认 RELEASED，物理上当前为空载。
    # 提前更新软件状态，确保后续抓取失败时恢复逻辑不会再次尝试释放旧工具。
    SET_GCODE_VARIABLE MACRO=_tool_status VARIABLE=current_tool VALUE=-1
    SAVE_VARIABLE VARIABLE=current_tool VALUE=-1

    {% if new_tool == -1 %}
        _FINISH_TOOL_UNLOAD
    {% else %}
        {% set next_heater = "extruder" if new_tool == 0 else ("extruder" ~ new_tool) %}
        {% set target_temp = printer[next_heater].target|float %}
        {% if target_temp > 0 %}
            {% if printer[next_heater].temperature < (target_temp - 2) %}
                M118 [换头调度] T{new_tool} 温度未达标，等待加热至 {target_temp}℃...
                TEMPERATURE_WAIT SENSOR={next_heater} MINIMUM={target_temp}
            {% endif %}
        {% endif %}
        _PICKUP_TOOL_ATTEMPT_1
    {% endif %}

#-------------------------------------------------
# 6.4 抓取：第1次 / 第2次 / 第3次动作
#-------------------------------------------------
[gcode_macro _PICKUP_TOOL_ATTEMPT_1]
gcode:
    {% set new_tool = printer["gcode_macro _tool_status"].pending_tool|int %}
    {% if printer["gcode_button tool_sensor"].state == "RELEASED" %}
        M118 [抓取安全检查] T{new_tool} 第1次抓取前确认通过：传感器=RELEASED。
        _pickup_tool TOOL={new_tool}
        M400
        G4 P200
        _CHECK_PICKUP_TOOL_1
    {% else %}
        M118 [抓取安全检查] !!! T{new_tool} 第1次抓取被禁止：传感器仍为PRESSED，疑似当前仍有工具头或传感器未释放。
        _TOOL_CHANGE_FAILURE TYPE=PICKUP_PRECHECK
    {% endif %}

[gcode_macro _PICKUP_TOOL_ATTEMPT_2]
gcode:
    {% set new_tool = printer["gcode_macro _tool_status"].pending_tool|int %}
    M118 [换头验证] T{new_tool} 抓取第1次失败，准备第2次抓取尝试...
    {% if printer["gcode_button tool_sensor"].state == "RELEASED" %}
        M118 [抓取安全检查] T{new_tool} 第2次抓取前确认通过：传感器=RELEASED。
        _pickup_tool TOOL={new_tool}
        M400
        G4 P200
        _CHECK_PICKUP_TOOL_2
    {% else %}
        M118 [抓取安全检查] !!! T{new_tool} 第2次抓取被禁止：传感器仍为PRESSED，疑似当前仍有工具头或传感器未释放。
        _TOOL_CHANGE_FAILURE TYPE=PICKUP_PRECHECK
    {% endif %}

[gcode_macro _PICKUP_TOOL_ATTEMPT_3]
gcode:
    {% set new_tool = printer["gcode_macro _tool_status"].pending_tool|int %}
    M118 [换头验证] T{new_tool} 抓取第2次仍失败，先执行 Y→X 归位后进行第3次抓取...
    G28 Y
    G28 X
    _PICKUP_TOOL_PRECHECK_3

[gcode_macro _PICKUP_TOOL_PRECHECK_3]
gcode:
    {% set new_tool = printer["gcode_macro _tool_status"].pending_tool|int %}
    # 这里是独立宏，因此传感器状态是在 Y→X 归位完成后重新读取。
    {% if printer["gcode_button tool_sensor"].state == "RELEASED" %}
        M118 [抓取安全检查] T{new_tool} 第3次抓取前确认通过：传感器=RELEASED。
        _pickup_tool TOOL={new_tool}
        M400
        G4 P200
        _CHECK_PICKUP_TOOL_3
    {% else %}
        M118 [抓取安全检查] !!! T{new_tool} 第3次抓取被禁止：Y→X 归位后传感器仍为PRESSED，疑似当前仍有工具头或传感器未释放。
        _TOOL_CHANGE_FAILURE TYPE=PICKUP_PRECHECK
    {% endif %}

#-------------------------------------------------
# 6.5 抓取：第1/2/3次结果检查
#-------------------------------------------------
[gcode_macro _CHECK_PICKUP_TOOL_1]
gcode:
    {% set cfg = printer["gcode_macro _toolchanger_cfg"] %}
    {% set new_tool = printer["gcode_macro _tool_status"].pending_tool|int %}
    {% if cfg.enable_sensor_check|int == 0 %}
        M118 [换头验证] 工具传感器验证已关闭，T{new_tool} 视为抓取成功。
        _FINISH_TOOL_PICKUP
    {% elif printer["gcode_button tool_sensor"].state == "PRESSED" %}
        M118 [换头验证] T{new_tool} 第1次抓取确认成功：传感器=PRESSED。
        _FINISH_TOOL_PICKUP
    {% else %}
        M118 [换头验证] T{new_tool} 第1次抓取失败：传感器仍为RELEASED。
        _PICKUP_TOOL_ATTEMPT_2
    {% endif %}

[gcode_macro _CHECK_PICKUP_TOOL_2]
gcode:
    {% set cfg = printer["gcode_macro _toolchanger_cfg"] %}
    {% set new_tool = printer["gcode_macro _tool_status"].pending_tool|int %}
    {% if cfg.enable_sensor_check|int == 0 %}
        M118 [换头验证] 工具传感器验证已关闭，T{new_tool} 视为抓取成功。
        _FINISH_TOOL_PICKUP
    {% elif printer["gcode_button tool_sensor"].state == "PRESSED" %}
        M118 [换头验证] T{new_tool} 第2次抓取确认成功：传感器=PRESSED。
        _FINISH_TOOL_PICKUP
    {% else %}
        M118 [换头验证] T{new_tool} 第2次抓取失败：传感器仍为RELEASED。
        _PICKUP_TOOL_ATTEMPT_3
    {% endif %}

[gcode_macro _CHECK_PICKUP_TOOL_3]
gcode:
    {% set cfg = printer["gcode_macro _toolchanger_cfg"] %}
    {% set new_tool = printer["gcode_macro _tool_status"].pending_tool|int %}
    {% if cfg.enable_sensor_check|int == 0 %}
        M118 [换头验证] 工具传感器验证已关闭，T{new_tool} 视为抓取成功。
        _FINISH_TOOL_PICKUP
    {% elif printer["gcode_button tool_sensor"].state == "PRESSED" %}
        M118 [换头验证] T{new_tool} 第3次抓取确认成功：传感器=PRESSED。
        _FINISH_TOOL_PICKUP
    {% else %}
        M118 [换头验证] !!! T{new_tool} 第3次抓取仍失败：传感器=RELEASED。
        _TOOL_CHANGE_FAILURE TYPE=PICKUP
    {% endif %}

#-------------------------------------------------
# 6.6 成功收尾
#-------------------------------------------------
# 成功后 MOVE=0：恢复 G-code 解析状态，但不移动回换头前 XYZ；
# 工具会停留在当前安全位置。SAVE_GCODE_STATE 同时保存了 G-code offset，
# 因此这里恢复旧状态后，再写入目标工具自己的偏移。
#-------------------------------------------------
[gcode_macro _FINISH_TOOL_PICKUP]
description: 工具头抓取成功后的统一收尾
gcode:
    {% set new_tool = printer["gcode_macro _tool_status"].pending_tool|int %}
    {% set status = printer["gcode_macro _tool_status"] %}
    {% set svv = printer.save_variables.variables %}
    {% set off_x = svv["t" ~ new_tool ~ "_offset_x"] | default(0.0) | float %}
    {% set off_y = svv["t" ~ new_tool ~ "_offset_y"] | default(0.0) | float %}
    {% set off_z = svv["t" ~ new_tool ~ "_offset_z"] | default(0.0) | float %}
    {% set total_changes = svv.total_tool_changes | default(0) | int + 1 %}
    {% set recovering = status.recovery_pending|int %}

    M118 [换头调度] T{new_tool} 已确认抓取成功，开始恢复 G-code 状态...

    SET_GCODE_VARIABLE MACRO=_tool_status VARIABLE=current_tool VALUE={new_tool}
    SAVE_VARIABLE VARIABLE=current_tool VALUE={new_tool}
    SAVE_VARIABLE VARIABLE=total_tool_changes VALUE={total_changes}

    # 成功换头：恢复 G-code 解析状态，但不移动回换头前 XYZ。
    RESTORE_GCODE_STATE NAME=tool_change MOVE=0
    SET_VELOCITY_LIMIT ACCEL={status.saved_accel}
    SET_GCODE_OFFSET X={off_x} Y={off_y} Z={off_z} MOVE=0

    SET_GCODE_VARIABLE MACRO=_tool_status VARIABLE=pending_tool VALUE=-1

    {% if recovering == 1 %}

        # -----------------------------------------------------
        # 失败后的恢复成功：回到暂停前位置并真正恢复打印。
        # -----------------------------------------------------
        M118 [换头恢复] T{new_tool} 已成功重新获取，正在恢复打印位置...

        RESTORE_GCODE_STATE NAME=PAUSE_state MOVE=1 MOVE_SPEED=150
        SET_GCODE_OFFSET X={off_x} Y={off_y} Z={off_z} MOVE=0

        SET_GCODE_VARIABLE MACRO=_tool_status VARIABLE=recovery_pending VALUE=0
        SET_GCODE_VARIABLE MACRO=_tool_status VARIABLE=recovery_tool VALUE=-1
        SET_GCODE_VARIABLE MACRO=_tool_status VARIABLE=recovery_type VALUE=0
        SET_GCODE_VARIABLE MACRO=_tool_status VARIABLE=recovery_running VALUE=0
        SET_GCODE_VARIABLE MACRO=_tool_status VARIABLE=failure_reported VALUE=0

        M118 [换头恢复] T{new_tool} 恢复成功，继续打印。
        BASE_RESUME

    {% else %}

        M118 [换头调度] T{new_tool} 换头成功，偏移已加载 X={off_x} Y={off_y} Z={off_z}。累计成功装载次数: {total_changes}次

    {% endif %}

[gcode_macro _FINISH_TOOL_UNLOAD]
description: 工具头卸载成功后的统一收尾
gcode:
    {% set status = printer["gcode_macro _tool_status"] %}
    {% set recovering = status.recovery_pending|int %}

    M118 [换头调度] 当前工具头已确认卸载成功，恢复 G-code 状态...

    SET_GCODE_VARIABLE MACRO=_tool_status VARIABLE=current_tool VALUE=-1
    SAVE_VARIABLE VARIABLE=current_tool VALUE=-1

    # 成功卸载：不返回换头前 XYZ，停留在当前位置。
    RESTORE_GCODE_STATE NAME=tool_change MOVE=0
    SET_VELOCITY_LIMIT ACCEL={status.saved_accel}
    SET_GCODE_VARIABLE MACRO=_tool_status VARIABLE=pending_tool VALUE=-1
    SET_GCODE_OFFSET X=0 Y=0 Z=0 MOVE=0

    {% if recovering == 1 %}
        # 仅当原目标就是空载时，卸载成功才意味着恢复流程可以结束。
        M118 [换头恢复] 工具头已成功卸载，正在恢复打印位置...

        RESTORE_GCODE_STATE NAME=PAUSE_state MOVE=1 MOVE_SPEED=150
        SET_GCODE_OFFSET X=0 Y=0 Z=0 MOVE=0

        SET_GCODE_VARIABLE MACRO=_tool_status VARIABLE=recovery_pending VALUE=0
        SET_GCODE_VARIABLE MACRO=_tool_status VARIABLE=recovery_tool VALUE=-1
        SET_GCODE_VARIABLE MACRO=_tool_status VARIABLE=recovery_type VALUE=0
        SET_GCODE_VARIABLE MACRO=_tool_status VARIABLE=recovery_running VALUE=0
        SET_GCODE_VARIABLE MACRO=_tool_status VARIABLE=failure_reported VALUE=0

        M118 [换头恢复] 卸载恢复成功，继续打印。
        BASE_RESUME
    {% else %}
        M118 [换头调度] 工具头已成功卸载，当前为空载状态。
    {% endif %}

#-------------------------------------------------
# 6.7 失败收尾
#
# 最终失败只输出一次 RESPOND TYPE=error，并记录打印中恢复所需的信息；
# 不抛出会沿多层宏调用栈重复显示的模板异常。
#-------------------------------------------------
[gcode_macro _TOOL_CHANGE_FAILURE]
description: 换头最终失败处理，并保存打印恢复信息
gcode:
    {% set failure_type = params.TYPE|default("UNKNOWN")|string %}
    {% set status = printer["gcode_macro _tool_status"] %}
    {% set current_tool = status.current_tool|int %}
    {% set pending_tool = status.pending_tool|int %}
    {% set already_reported = status.failure_reported|int %}

    # 失败消息所指的工具：抓取失败看 pending_tool，卸载失败看 current_tool。
    {% set failed_tool = pending_tool if failure_type in ["PICKUP", "PICKUP_PRECHECK"] else current_tool %}

    {% if already_reported == 0 %}
        SET_GCODE_VARIABLE MACRO=_tool_status VARIABLE=failure_reported VALUE=1

        # -----------------------------------------------------
        # 记录打印中的恢复目标。
        # 即使随后把 pending_tool 清掉，RESUME 仍能知道原来要抓哪一个。
        # -----------------------------------------------------
        {% if printer.print_stats.state == "printing" or printer.pause_resume.is_paused %}

            SET_GCODE_VARIABLE MACRO=_tool_status VARIABLE=recovery_pending VALUE=1
            SET_GCODE_VARIABLE MACRO=_tool_status VARIABLE=recovery_tool VALUE={pending_tool}

            {% if failure_type in ["PICKUP", "PICKUP_PRECHECK"] %}
                SET_GCODE_VARIABLE MACRO=_tool_status VARIABLE=recovery_type VALUE=1

                # 旧工具已经在正常释放阶段通过传感器确认 RELEASED；
                # 当前物理状态应当为空载。
                SET_GCODE_VARIABLE MACRO=_tool_status VARIABLE=current_tool VALUE=-1
                SAVE_VARIABLE VARIABLE=current_tool VALUE=-1
            {% else %}
                SET_GCODE_VARIABLE MACRO=_tool_status VARIABLE=recovery_type VALUE=2
                # 卸载失败时旧工具仍然认为在机上，因此 current_tool 不清零。
            {% endif %}

            SET_GCODE_VARIABLE MACRO=_tool_status VARIABLE=recovery_running VALUE=0

        {% endif %}

        # 失败分支：真正回到换头前位置。
        M118 [换头失败] 正在恢复换头前状态与位置...
        RESTORE_GCODE_STATE NAME=tool_change MOVE=1
        SET_VELOCITY_LIMIT ACCEL={status.saved_accel}
        SET_GCODE_VARIABLE MACRO=_tool_status VARIABLE=pending_tool VALUE=-1
        M400

        {% if failure_type == "PICKUP_PRECHECK" %}
            RESPOND TYPE=error MSG="[换头安全] T{failed_tool} 抓取前安全检查失败：工具传感器为 PRESSED，禁止继续抓取。"
        {% elif failure_type == "PICKUP" %}
            RESPOND TYPE=error MSG="[换头失败] 获取 T{failed_tool} 工具头失败：连续3次尝试均未检测到工具头。"
        {% elif failure_type == "UNLOAD" %}
            RESPOND TYPE=error MSG="[换头失败] 卸载 T{failed_tool} 工具头失败：连续3次尝试均未确认卸载。"
        {% else %}
            RESPOND TYPE=error MSG="[换头失败] 工具切换失败：发生未知换头错误。"
        {% endif %}

        {% if printer.print_stats.state == "printing" %}
            M118 [换头失败] 打印中：已回到换头前位置并暂停，请人工处理后点击“继续”。
        {% elif printer.pause_resume.is_paused %}
            M118 [换头恢复] 重新尝试换头仍然失败，打印保持暂停。请人工处理后再次点击“继续”。
        {% else %}
            M118 [换头失败] 非打印状态：当前流程已停止，请人工检查工具头与停靠坞状态。
        {% endif %}

        # 打印中或已有暂停时暂停；非打印状态也使用 PAUSE 让当前 G-code 不继续向下执行。
        {% if not printer.pause_resume.is_paused %}
            PAUSE
        {% endif %}
    {% endif %}

#-------------------------------------------------
# 7. 主切换宏（同步核心调度中枢）
#-------------------------------------------------
[gcode_macro change_tool]
description: 同步执行工具头切换，含抓取/卸载验证、三级重试与失败恢复
gcode:
    {% set new_tool = params.T|default(-1)|int %}
    {% set status = printer["gcode_macro _tool_status"] %}
    {% set old_tool = status.current_tool|int %}
    {% set cfg = printer["gcode_macro _toolchanger_cfg"] %}
    {% set recovery_running = status.recovery_running|int %}

    # 普通换头开始时清理上一次已结束的恢复状态。
    # 失败后的 RESUME 重试则保留 recovery_pending/recovery_tool。
    {% if recovery_running == 0 %}
        SET_GCODE_VARIABLE MACRO=_tool_status VARIABLE=recovery_pending VALUE=0
        SET_GCODE_VARIABLE MACRO=_tool_status VARIABLE=recovery_tool VALUE=-1
        SET_GCODE_VARIABLE MACRO=_tool_status VARIABLE=recovery_type VALUE=0
        SET_GCODE_VARIABLE MACRO=_tool_status VARIABLE=failure_reported VALUE=0
    {% endif %}

    {% if new_tool == old_tool %}
        M118 [换头调度] 目标工具与当前一致 (T{new_tool})，无需执行任何动作

    {% else %}
        SET_GCODE_VARIABLE MACRO=_tool_status VARIABLE=pending_tool VALUE={new_tool}

        {% if new_tool == -1 %}
            M118 [换头调度] 收到卸载指令，准备将 T{old_tool} 放回停靠坞...
        {% else %}
            M118 [换头调度] 开始执行换头：从 T{old_tool} 切换至 T{new_tool}
        {% endif %}

        # =====================================================
        # 保存换头前状态
        # =====================================================
        SAVE_GCODE_STATE NAME=tool_change
        SET_GCODE_VARIABLE MACRO=_tool_status VARIABLE=saved_accel VALUE={printer.toolhead.max_accel}
        SET_VELOCITY_LIMIT ACCEL={cfg.accel_toolchange}

        # =====================================================
        # 换头期间只读取普通 gcode_button，不再存在断料传感器启停。
        # =====================================================

        # =====================================================
        # 抬升 Z
        # =====================================================
        M118 [换头调度] 相对抬升Z轴 {cfg.z_hop}mm...
        G91
        G0 Z{cfg.z_hop} F{cfg.feed_z}
        G90

        # 换头运动全部使用机械绝对坐标。
        M118 [换头调度] 临时清空坐标偏移量，采用绝对机械坐标寻址...
        SET_GCODE_OFFSET X=0 Y=0 Z=0

        # =====================================================
        # 释放旧工具
        # =====================================================
        {% if old_tool != -1 %}
            _RELEASE_TOOL_ATTEMPT_1
        {% else %}
            M118 [换头调度] 当前属于空载状态，跳过释放步骤。

            {% if new_tool == -1 %}
                _FINISH_TOOL_UNLOAD
            {% else %}
                {% set next_heater = "extruder" if new_tool == 0 else ("extruder" ~ new_tool) %}
                {% set target_temp = printer[next_heater].target|float %}

                {% if target_temp > 0 %}
                    {% if printer[next_heater].temperature < (target_temp - 2) %}
                        M118 [换头调度] T{new_tool} 温度未达标，等待加热至 {target_temp}℃...
                        TEMPERATURE_WAIT SENSOR={next_heater} MINIMUM={target_temp}
                    {% endif %}
                {% endif %}

                _PICKUP_TOOL_ATTEMPT_1
            {% endif %}
        {% endif %}
    {% endif %}

#=================================================
# 8. 换头计数管理工具（用户可调用指令）
#=================================================

[gcode_macro GET_TOOL_CHANGE_COUNT]
description: 查询当前累计的换头总次数
gcode:
    {% set svv = printer.save_variables.variables %}
    {% set total_changes = svv.total_tool_changes | default(0) | int %}
    M118 [换头统计] 当前累计换头总次数为: {total_changes} 次

[gcode_macro RESET_TOOL_CHANGE_COUNT]
description: 重置总换头次数计数器为0
gcode:
    SAVE_VARIABLE VARIABLE=total_tool_changes VALUE=0
    M118 [换头统计] 历史总换头次数已成功重置为 0

#=================================================
# 8.5 工具头验证开关
#
# 传感器本身始终作为普通 gcode_button 工作，不存在“传感器启用/禁用”状态。
# 这里仅控制换头时是否读取传感器进行成功验证。
#=================================================
[gcode_macro DISABLE_TOOL_SENSOR]
description: 关闭换头成功/卸载成功验证
gcode:
    SET_GCODE_VARIABLE MACRO=_toolchanger_cfg VARIABLE=enable_sensor_check VALUE=0
    M118 [工具传感器] 已关闭换头结果验证；传感器本身仍作为普通按钮输入工作

[gcode_macro ENABLE_TOOL_SENSOR]
description: 开启换头成功/卸载成功验证
gcode:
    SET_GCODE_VARIABLE MACRO=_toolchanger_cfg VARIABLE=enable_sensor_check VALUE=1
    M118 [工具传感器] 已开启换头结果验证；PRESSED=抓取成功，RELEASED=卸载成功

[gcode_macro GET_TOOL_SENSOR_STATUS]
description: 查询工具头传感器状态与换头验证开关
gcode:
    {% set cfg = printer["gcode_macro _toolchanger_cfg"] %}
    {% set sensor_state = printer["gcode_button tool_sensor"].state %}
    {% if cfg.enable_sensor_check|int == 1 %}
        M118 [工具传感器] 换头结果验证: 开启 | 当前状态: {sensor_state}
    {% else %}
        M118 [工具传感器] 换头结果验证: 关闭 | 当前状态: {sensor_state}
    {% endif %}
