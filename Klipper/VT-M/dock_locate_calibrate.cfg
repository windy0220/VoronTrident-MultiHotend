
[gcode_macro _User_Variables]
variable_skip_homing_park: 0
gcode:
    # 这里可以空着，或者放一个默认动作

# ============================================================
# 多热端停靠坞定位校准
# ============================================================

[dock_locate_calibrate]

# ------------------------------------------------------------
# MCU 位置分辨率
# ------------------------------------------------------------

# 这取决于打印机的步进电机配置。
#
# 本次校准使用的当前值：
#   rotation_distance: 40
#   full_steps_per_rotation: 200
#
# 如果你使用了不同的上述值，
# 需要自行计算并修改 xy_resolution。

# xy_resolution: 0.0125
# 如果使用 16 微步，取消此行注释

# xy_resolution: 0.00625
# 如果使用 32 微步，取消此行注释

xy_resolution: 0.003125
# 如果使用 64 微步，取消此行注释


# ------------------------------------------------------------
# 打印机 X/Y 回零位置
# ------------------------------------------------------------

# 重要：
# 这里使用的是实际的 X/Y position_endstop 值。
# 不是床尺寸，也不是 position_max。

x_endstop: 299
y_endstop: 305


# ------------------------------------------------------------
# 校准移动
# ------------------------------------------------------------

# 运动平台在回零前向右移动的距离。

# calibrate_move_x: 3.0


# ------------------------------------------------------------
# 校准顺序
# ------------------------------------------------------------

# 1. 建立临时运动学位置
# 2. 将滑台向右移动 3mm
# 3. 回零 Y
# 4. 等待 1 秒
# 5. 回零 X
#
# 重要：
# 这个动作目前被写死为 X3。
# 请保持 calibrate_move_x 设为 3.0。

dock_calibrate_move_gcode:
    SET_KINEMATIC_POSITION
    # G91
    # G1 X3 F3000
    G90
    G28 Y
    G4 P500
    G28 X


# ============================================================
# Fluidd 按钮
# ============================================================

[gcode_macro DOCK_CALIBRATION]
description: 启动停靠位定位校准
gcode:
    DOCK_LOCATE_CALIBRATE