#####################################################################
# 	开始打印宏
#####################################################################
[gcode_macro PRINT_START]
gcode:
    # # 获取参数
    # {% set BED_TEMP = params.BED|default(60)|float %}
    # {% set EXTRUDER_TEMP = params.EXTRUDER|default(190)|float %}

    # ==========================================
    # 1. 接收切片软件传来的参数
    # ==========================================
    {% set BED_TEMP = params.BED|default(60)|float %}            
    
    # 重点：接收初始喷头编号，并转为字符串方便后面比对
    {% set INITIAL_TOOL = params.INITIAL_TOOL|default("0")|string %} 
    
    {% set tools_str = params.TOOLS|default("0,")|string %}
    {% set tool_list = tools_str.split(',') %}
    {% set temps_str = params.TEMPS|default("200,")|string %}
    {% set temp_list = temps_str.split(',') %}

    {% set start_x = params.START_X|default(30.0)|float %}
    {% set start_y = params.START_Y|default(45.0)|float %}
    {% set offset_y = params.OFFSET_Y|default(3.0)|float %}
    {% set prime_length = params.LENGTH|default(220.0)|float %}
    {% set pre_extrude = params.PRE_EXTRUDE|default(3.0)|float %}

	# 这些是调试参数用于检查 切片软件传过来的参数。

   #    RESPOND MSG="BED_TEMP={BED_TEMP}"
   #    RESPOND MSG="INITIAL_TOOL={INITIAL_TOOL}"
   #    RESPOND MSG="TOOLS={tools_str}"
   #    RESPOND MSG="TEMPS={temps_str}"
   #    RESPOND MSG="tool_list={tool_list}"
   #    RESPOND MSG="temp_list={temp_list}"
   #    RESPOND MSG="start_x={start_x}"
   #    RESPOND MSG="start_y={start_y}"
   #    { action_raise_error("Error message") }

     # ==========================================
    # 2. 预热热床与机器归零调平
    # ==========================================
    G28
    BED_MESH_CLEAR
    # 开始加热热床
    M118 [准备打印] 开始加热热床
    # M140 S{BED_TEMP}          
    M190 S{BED_TEMP}  # 等待热床加热至指定温度       

    # 3Z调平
    M140 S0 #停止加热热床，避免干扰涡流探测
    M118 [准备打印] 3Z调平
    Z_TILT_ADJUST
    
    # 网床 这里使用了EDDY进行扫床。  METHOD=rapid_scan 为扫床 ADAPTIVE=1 为自适应网床
    M118 [准备打印] 扫描热床
    BED_MESH_CALIBRATE METHOD=rapid_scan ADAPTIVE=1

    # 使用EDDY-NG 进行精确Z归位
    M118 [准备打印] 精确定位Z坐标
    M109 T0 S160
    T0
    TAP_BASE_TOOL
    FRICTION_NOZZLE # 磨嘴
    TAP_BASE_TOOL
    UNTOOL
    M109 T0 S0
    M140 S{BED_TEMP}   #重新恢复热床加热

    # ==========================================
    # 3. 按独立温度加热所有【用到】的喷头
    # ==========================================
    M118 [准备打印] 加热所有用到的热端
    {% for i in range(tool_list|length) %}
        {% if tool_list[i] != "" and temp_list[i] != "" %}
            M104 S{temp_list[i]} T{tool_list[i]}
        {% endif %}
    {% endfor %}

    {% for i in range(tool_list|length) %}
        {% if tool_list[i] != "" and temp_list[i] != "" %}
            M109 S{temp_list[i]} T{tool_list[i]}
        {% endif %}
    {% endfor %}

    M190 S{BED_TEMP}  # 等待热床加热至指定温度     

    # ==========================================
    # 4. 依次切换喷头并进行边缘划线
    # ==========================================
    M118 [准备打印] 划线开始
    SAVE_GCODE_STATE NAME=print_start_state
    G90 
    G92 E0 

    {% set ns = namespace(line_index=0) %}

    # ----- 第 1 步：先给【非初始头】划线 -----
    {% for tool in tool_list %}
        # 只要不是空值，且【不是初始头】，就先给它划线
        {% if tool != "" and tool != INITIAL_TOOL %}
            T{tool}
            {% set current_y = start_y + (ns.line_index * offset_y) %}
            G1 Z5.0 F3000
            G1 X{start_x} Y{current_y} F6000
            G1 Z0.28 F1500
            G91 
            G1 E{pre_extrude} F300 
            G1 X{prime_length * 0.6} E{prime_length * 0.12} F1000 
            G1 X{prime_length * 0.4} E{prime_length * 0.05} F1500 
            G1 E-1.5 F2100 
            G1 Z2.0 F3000
            G90
            G92 E0
            M104 S180 T{tool}
            {% set ns.line_index = ns.line_index + 1 %}
        {% endif %}
    {% endfor %}

    # ----- 第 2 步：最后给【初始头】划线 -----
    # 确保切片传来的初始头确实在用到的列表里，然后最后拿起它划线
    {% if INITIAL_TOOL in tool_list %}
        T{INITIAL_TOOL}
        {% set current_y = start_y + (ns.line_index * offset_y) %}
        G1 Z5.0 F3000
        G1 X{start_x} Y{current_y} F6000
        G1 Z0.28 F1500
        G91 
        G1 E{pre_extrude} F300 
        G1 X{prime_length * 0.6} E{prime_length * 0.12} F1000 
        G1 X{prime_length * 0.4} E{prime_length * 0.05} F1500 
        G1 E0 F2100 
        G1 Z2.0 F3000
        G90
        G92 E0
        # 这里划完线之后，机器正好拿的就是初始头！
    {% endif %}

   # ==========================================
    # 5. 恢复状态，交给切片软件接管
    # ==========================================
    RESTORE_GCODE_STATE NAME=print_start_state
    
    {% if INITIAL_TOOL in tool_list %}
        {% set svv = printer.save_variables.variables %}
        {% set off_x = svv["t" ~ INITIAL_TOOL ~ "_offset_x"] | default(0.0) | float %}
        {% set off_y = svv["t" ~ INITIAL_TOOL ~ "_offset_y"] | default(0.0) | float %}
        {% set off_z = svv["t" ~ INITIAL_TOOL ~ "_offset_z"] | default(0.0) | float %}
        
        SET_GCODE_OFFSET X={off_x} Y={off_y} Z={off_z} MOVE=0
        
        { action_respond_info("初始头 T" ~ INITIAL_TOOL ~ " 已从外部文件应用偏移。") }
    {% endif %}
   
    { action_respond_info("划线结束。目前喷头为 T" ~ INITIAL_TOOL ~ "，已重新加载坐标偏移，准备直接打印！") }
    M118 [准备打印] 开始打印

#####################################################################
# 	结束打印宏
#####################################################################
[gcode_macro PRINT_END]
description: 打印结束宏：卸载工具、关闭加热、热床降到底部方便取模
gcode:
    # 1. 获取机器定义的范围
    {% set max_x = printer.configfile.config["stepper_x"]["position_max"]|float %}
    {% set max_y = printer.configfile.config["stepper_y"]["position_max"]|float %}
    {% set max_z = printer.configfile.config["stepper_z"]["position_max"]|float %}
    
    # 2. 卸载工具头并重置偏移量
    UNTOOL
    SET_GCODE_OFFSET X=0 Y=0 Z=0 

    M400                              # 等待缓冲区清除
    G92 E0                            # 将挤出机计数归零
    
    # 3. 先进行安全小抬升 (相对坐标)
    G91                               # 相对定位
    # 向上抬升 5mm (如果没超过最大高度的话)
    {% if printer.toolhead.position.z < (max_z - 5) %}
        G0 Z5 F3600 
    {% endif %}
    
    # 4. 关闭所有加热源和风扇
    M104 S0 T0                        
    M104 S0 T1                        
    M104 S0 T2                        
    M104 S0 T3                        
    M140 S0                           # 关闭热床
    M106 S0                           # 关闭模型风扇
    
    # 5. 执行“取模位”移动 (绝对坐标)
    G90                               # 切换回绝对坐标
    {% set safe_z = max_z - 10 %}
    
    G0 X{max_x} Y{max_y} Z{safe_z} F6000
    
    # 6. 后期处理
    M400                              # 等待移动完成
    BED_MESH_CLEAR                    # 卸载网床
    # PROBE_EDDY_NG_SET_TAP_OFFSET VALUE=0 ;清理eddy-ng 偏移量
    # M84                             # 可选：如果你想手动取模更轻松，可以取消注释这行关闭电机
    
    { action_respond_info("打印完成！热床已降下，请取模。") }
    
#####################################################################
# 暂停打印宏
#####################################################################
[gcode_macro PAUSE]
rename_existing: BASE_PAUSE
gcode:
    # ----- 参数设置 -----
    {% set z_hop = 5.0 %}            ; 暂停时抬升的高度 (mm)
    {% set x_park = 280.0 %}         ; 停车位置 X 坐标
    {% set y_park = 40.0 %}          ; 停车位置 Y 坐标
    {% set retract_len = 0 %}        ; 暂停时的回抽长度 (mm)

    # 1. 保存暂停前 G-code 状态
    #    换头失败时，swap.cfg 会先恢复 tool_change 状态到换头前位置，
    #    因此这里保存的 PAUSE_state 就是正确的打印位置。
    SAVE_GCODE_STATE NAME=PAUSE_state

    # 2. 执行基础暂停
    BASE_PAUSE

    # 3. 安全回抽
    {% if printer.extruder.can_extrude and retract_len > 0 %}
        M83
        G1 E-{retract_len} F2100
    {% endif %}

    # 4. 计算安全 Z 抬升高度
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set cur_z = printer.toolhead.position.z|float %}
    {% if cur_z < (max_z - z_hop) %}
        {% set z_safe = z_hop %}
    {% else %}
        {% set z_safe = max_z - cur_z %}
    {% endif %}

    G91
    G1 Z{z_safe} F900

    # 5. 移动到侧边停车位置
    G90
    G1 Y{y_park} F5000
    G1 X{x_park} F5000

    # 6. 根据暂停原因显示提示
    {% set status = printer["gcode_macro _tool_status"] %}

    {% if status.recovery_pending|int == 1 %}
        {% if status.recovery_type|int == 1 %}
            M118 [系统] 换头失败：T{status.recovery_tool} 获取失败，打印已暂停。
            M118 [系统] 请将 T{status.recovery_tool} 正确放回停靠坞，确认传感器为 RELEASED 后点击“继续”。
        {% elif status.recovery_type|int == 2 %}
            M118 [系统] 换头失败：当前热端卸载失败，打印已暂停。
            M118 [系统] 请检查停靠坞与当前热端状态，然后点击“继续”重新尝试换头。
        {% else %}
            M118 [系统] 换头失败：未知恢复类型，打印已暂停。
            M118 [系统] 请人工检查工具头状态。
        {% endif %}
    {% else %}
        M118 [系统] 已安全停车，等待人工处理...
    {% endif %}

#####################################################################
# 恢复打印宏
#####################################################################
[gcode_macro RESUME]
rename_existing: BASE_RESUME
gcode:
    {% set retract_len = 0 %}        ; 必须与 PAUSE 中的回抽量一致
    {% set status = printer["gcode_macro _tool_status"] %}
    {% set recovery_pending = status.recovery_pending|int %}
    {% set recovery_type = status.recovery_type|int %}
    {% set recovery_tool = status.recovery_tool|int %}

    # =========================================================
    # 换头失败后的恢复流程
    # =========================================================
    {% if recovery_pending == 1 %}

        # -----------------------------------------------------
        # ① 获取工具失败
        # -----------------------------------------------------
        {% if recovery_type == 1 %}

            # 人工处理后，新工具应位于停靠坞内，此时传感器必须为 RELEASED。
            # 未释放时绝对不允许重新执行 T{recovery_tool}，避免再次撞入停靠坞。
            {% if printer["gcode_button tool_sensor"].state != "RELEASED" %}

                RESPOND TYPE=error MSG="[换头恢复] T{recovery_tool} 暂不能重新抓取：工具传感器仍为 PRESSED。"
                M118 [换头恢复] 请确认 T{recovery_tool} 已正确放入停靠坞，并确保传感器变为 RELEASED 后再次点击“继续”。

            {% else %}

                M118 [换头恢复] 正在恢复到换头失败前的打印位置...

                # 先回到暂停前位置。
                # 随后 _TOOL_CHANGE_RECOVER 会重新执行 T{recovery_tool}。
                RESTORE_GCODE_STATE NAME=PAUSE_state MOVE=1 MOVE_SPEED=150

                M118 [换头恢复] 正在重新尝试获取 T{recovery_tool}...

                # 不直接 BASE_RESUME。
                # 换头成功后由 swap.cfg 的 _FINISH_TOOL_PICKUP 自动恢复打印。
                _TOOL_CHANGE_RECOVER

            {% endif %}

        # -----------------------------------------------------
        # ② 卸载失败
        # -----------------------------------------------------
        {% elif recovery_type == 2 %}

            M118 [换头恢复] 正在恢复到换头失败前的打印位置...
            RESTORE_GCODE_STATE NAME=PAUSE_state MOVE=1 MOVE_SPEED=150

            M118 [换头恢复] 正在重新尝试完整换头流程...

            # 卸载失败时，当前工具通常仍然在机上。
            # _TOOL_CHANGE_RECOVER 会根据 recovery_tool 重新执行原目标 Txx，
            # 从而再次执行“卸载旧工具 → 抓取目标工具”的完整同步流程。
            # 成功后由 swap.cfg 的成功收尾宏自动恢复打印。
            _TOOL_CHANGE_RECOVER

        # -----------------------------------------------------
        # ③ 状态异常：拒绝直接恢复打印
        # -----------------------------------------------------
        {% else %}

            RESPOND TYPE=error MSG="[换头恢复] 检测到未知的换头恢复状态，拒绝直接恢复打印。"
            M118 [换头恢复] 请检查 _tool_status 的 recovery_type / recovery_tool 状态。

        {% endif %}

    # =========================================================
    # 普通暂停恢复
    # =========================================================
    {% else %}

        # 普通暂停时补回回抽
        {% if printer.extruder.can_extrude and retract_len > 0 %}
            M83
            G1 E{retract_len} F2100
        {% endif %}

        # 恢复暂停前 XYZ / G-code 状态
        RESTORE_GCODE_STATE NAME=PAUSE_state MOVE=1 MOVE_SPEED=150

        M118 [系统] 准备恢复打印...
        BASE_RESUME

    {% endif %}

#####################################################################
# 取消打印宏
#####################################################################
[gcode_macro CANCEL_PRINT]
description: Cancel the actual running print
rename_existing: CANCEL_PRINT_BASE
gcode:
  TURN_OFF_HEATERS
  CANCEL_PRINT_BASE
  G91
  G1 Z10 F600 ; 抬高喷嘴10mm避免烫坏模型
  UNTOOL
  M106 S0

#####################################################################
# 归位打印宏
#####################################################################
[homing_override]
axes: z
set_position_z: 0                 
gcode:
    G91
    G1 Z10 F480   
    G90 

    # 检查 Y 是否回零，如果没有则回零
    {% if "Y" not in printer.toolhead.homed_axes %}
        G28 Y
        G91
        G1 Y-10 F9000
        G90
    {% endif %}
    M400
    # 检查 X 是否回零，如果没有则回零
    {% if "X" not in printer.toolhead.homed_axes %}
        G28 X
         G91
        G1 X-10 F9000
        G90
    {% endif %}

    UNTOOL  # 执行你的卸载工具宏

    # 移动到热床中间进行 Z 回零（请根据你的床尺寸调整 X150 Y150）
    G0 X{ printer.toolhead.axis_maximum.x/2 } Y{ printer.toolhead.axis_maximum.y/2 } F6000

    # 正式执行 Z 回零
    G28 Z

    # 归位后稍微抬升一点
    G1 Z10 F480
