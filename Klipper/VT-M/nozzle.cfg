# 在PEI板磨嘴的动作，PEI板可能会损坏，保证Z精度
[gcode_macro FRICTION_NOZZLE]
description: 在PEI板上摩擦喷嘴，以提高Z限位精度
#请配置以下参数
variable_friction_x: 290        #摩擦点x坐标 pei板x中心位置，300热床为150
variable_friction_y: 50       #摩擦点Y坐标 pei板Y最大值减轻5
variable_friction_z: -0.5       #摩擦点Z坐标 理想值在-0.3至-1.01
gcode:
    {% set fx = params.X|default(friction_x)|float %}
    {% set fy = params.Y|default(friction_y)|float %}
    {% set fz = params.Z|default(friction_z)|float %}
    
    # M109 T0 S150 ; set temp down to heatbed acceptable
    M106 S255 ; turn on fan (G28 has turn off fan)
    # T0

    G1 X{fx} Y{fy} F6000
    M400
    M221 Z0 ; turn off Z axis endstop

    ; ===== 摩擦路径 =====
    {% set y_offsets = [-0.5, 2.5, 0, 2, 0.5, 1.5, 1.0] %}
    {% for off in y_offsets %}
        G0 Z0.5 F20000
        G0 X{fx} Y{fy + off} Z{fz}
        G0 X{fx+6} F211
        G0 X{fx-1}
    {% endfor %}

    ; 最后圆弧摩擦动作
    G0 X{fx+3}
    {% for i in range(4) %}
        G2 I0.5 J0 F300
    {% endfor %}

    # M109 T0 S140 ; wait nozzle temp down to heatbed acceptable
    {% for i in range(4) %}
        G2 I0.5 J0 F3000
    {% endfor %}

    M221 R ; pop softend status
    G1 Z10 F1200
    M400
    M106 S0 ;关闭风扇
    # M104 T0 S0 ;关闭喷嘴加热
    # UNTOOL
